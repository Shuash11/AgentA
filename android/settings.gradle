pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    resolutionStrategy {
        eachPlugin {
            // background_downloader 9.5.9 pins kotlin.plugin.serialization 2.1.0,
            // which mismatches the project's Kotlin 2.3.20 (serialization plugin
            // must match the compiler). Align to 2.3.20 — the same pin upstream
            // uses in background_downloader 9.6.2. Remove when the toolchain
            // reaches Flutter 3.47+ and background_downloader 9.6.x is taken.
            if (requested.id.id == 'org.jetbrains.kotlin.plugin.serialization') {
                useVersion('2.3.20')
            }
        }
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // Flutter 3.47.6 DependencyVersionChecker.kt floors: Gradle >= 8.14.0, AGP >= 8.11.1.
    id "com.android.application" version "8.11.1" apply false
    id "org.jetbrains.kotlin.android" version "2.3.20" apply false
}

include ":app"
