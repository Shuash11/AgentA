name: aiproject
description: "AgentA — AI Skill Coach"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.2
  flutter_bloc: ^8.1.6

  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1

  sqflite: ^2.3.3+1
  path: ^1.9.0

  http: ^1.2.1

  flutter_gemma: ^0.13.1
  path_provider: ^2.1.4

  connectivity_plus: ^6.0.3

  uuid: ^4.4.0

  flutter_secure_storage: ^9.2.2

  json_annotation: ^4.9.0

  cupertino_icons: ^1.0.8

  flutter_dotenv: ^5.2.1
  flutter_svg: ^2.2.4
  flutter_markdown_plus: ^1.0.7
  markdown: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
