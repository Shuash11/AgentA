name: aiproject
description: "AgentA"
publish_to: 'none'
version: 1.4.1+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.2
  flutter_bloc: ^9.1.1

  sqflite: ^2.3.3+1
  path: ^1.9.0

  http: ^1.2.1

  flutter_edge_ai: ^1.11.4
  flutter_edge_ai_mediapipe: ^1.0.8
  path_provider: ^2.1.4

  connectivity_plus: ^7.3.2

  # Update-check engine (post-first-frame init, see plus_plugins #309).
  # 10.x requires win32 ^6.0.1; satisfied via fss 10.3.4 -> fss_windows 4.2.x (win32 ^6).
  package_info_plus: ^10.2.2

  # Update dialog: dismissal persistence (SharedPreferencesAsync) + browser launch.
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

  uuid: ^4.4.0

  # Staged rollout complete: v1.2.4 shipped ^10 (9->10 auto-migration ran on
  # first access). v11 keeps the v10 default ciphers, so v10 data survives;
  # direct 9->11 remains documented data-loss — detected at boot by the
  # checkUpgradeStatus() hook (lib/main.dart) and degraded to
  # re-login/re-enroll, never silent. See plans/cycle-22.
  flutter_secure_storage: ^11.2.0

  crypto: ^3.0.6

  # Argon2id password hashing (F6/C5). Pure Dart, resolves at the same 4.0.0
  # already in the lockfile via dart_jsonwebtoken (supabase chain) — promoted
  # to a direct dependency so the version is under our control.
  pointycastle: ^4.0.0

  json_annotation: ^4.9.0

  flutter_svg: ^2.2.4
  flutter_markdown_plus: ^1.0.7
  markdown: ^7.2.2
  google_sign_in: ^7.2.0
  local_auth: ^3.0.2
  supabase_flutter: ^2.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.4

  # Test-only mocks for the update feature (prefs/launcher fakes).
  shared_preferences_platform_interface: ^2.4.2
  url_launcher_platform_interface: ^2.3.2

  # In-memory DB for DAO integration tests (replaceChatsPreservingUnsynced).
  sqflite_common_ffi: ^2.3.6

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
