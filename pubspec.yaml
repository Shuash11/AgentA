name: aiproject
description: "AgentA — AI Skill Coach"
publish_to: 'none'
version: 1.2.3+6

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.2
  flutter_bloc: ^8.1.6

  sqflite: ^2.3.3+1
  path: ^1.9.0

  http: ^1.2.1

  flutter_edge_ai: ^1.11.4
  flutter_edge_ai_mediapipe: ^1.0.8
  path_provider: ^2.1.4

  connectivity_plus: ^6.0.3

  # Update-check engine (post-first-frame init, see plus_plugins #309).
  # 9.x pinned: >=10.1.0 needs win32 ^6.0.1 which conflicts with
  # flutter_secure_storage 9.x -> flutter_secure_storage_windows 3.1.2 (win32 ^5).
  package_info_plus: ^9.0.1

  # Update dialog: dismissal persistence (SharedPreferencesAsync) + browser launch.
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

  uuid: ^4.4.0

  flutter_secure_storage: ^9.2.2

  crypto: ^3.0.6

  json_annotation: ^4.9.0

  cupertino_icons: ^1.0.8

  flutter_dotenv: ^5.2.1
  flutter_svg: ^2.2.4
  flutter_markdown_plus: ^1.0.7
  markdown: ^7.2.2
  google_sign_in: ^7.2.0
  local_auth: ^3.0.2
  supabase_flutter: ^2.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.13.1

  # Test-only mocks for the update feature (prefs/launcher fakes).
  shared_preferences_platform_interface: ^2.4.2
  url_launcher_platform_interface: ^2.3.2

  # In-memory DB for DAO integration tests (replaceChatsPreservingUnsynced).
  sqflite_common_ffi: ^2.3.6

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
