name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.1"
          cache: true

      - name: Create .env
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          GEMMA_MODEL_URL: ${{ secrets.GEMMA_MODEL_URL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::Missing SUPABASE_URL secret"
            exit 1
          fi
          # Trim whitespace (secrets pasted with trailing newlines are a classic instant-cancel cause).
          GOOGLE_SERVER_CLIENT_ID="$(echo "$GOOGLE_SERVER_CLIENT_ID" | tr -d '[:space:]')"
          export GOOGLE_SERVER_CLIENT_ID
          if [ -z "$GOOGLE_SERVER_CLIENT_ID" ]; then
            echo "::warning::GOOGLE_SERVER_CLIENT_ID secret empty - Google sign-in will report 'not configured'"
            echo "GOOGLE_AUTH_STATUS=missing" >> "$GITHUB_ENV"
          elif [[ "$GOOGLE_SERVER_CLIENT_ID" != *.apps.googleusercontent.com ]]; then
            echo "::error::GOOGLE_SERVER_CLIENT_ID malformed (must be the Web OAuth client ending in .apps.googleusercontent.com, not an Android client ID). See docs/google-signin-setup.md"
            echo "GOOGLE_AUTH_STATUS=invalid" >> "$GITHUB_ENV"
          else
            echo "GOOGLE_AUTH_STATUS=ok" >> "$GITHUB_ENV"
          fi
          cat > .env <<EOF
          GROQ_API_KEY=$GROQ_API_KEY
          MINIMAX_API_KEY=$MINIMAX_API_KEY
          KAGGLE_USERNAME=$KAGGLE_USERNAME
          KAGGLE_KEY=$KAGGLE_KEY
          GEMMA_MODEL_URL=$GEMMA_MODEL_URL
          HF_TOKEN=$HF_TOKEN
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY
          GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID
          EOF

      - run: flutter pub get
      - name: Validate Google auth config
        run: |
          if [ "${GOOGLE_AUTH_STATUS:-missing}" = "invalid" ]; then
            echo "::error::Refusing to ship with malformed GOOGLE_SERVER_CLIENT_ID. Fix the secret (Web client, see docs/google-signin-setup.md)."
            exit 1
          fi
      - run: flutter analyze
      - run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p dist
          TAG="${GITHUB_REF_NAME}"
          SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            NAME="AgentA-${TAG}.apk"
          else
            NAME="AgentA-${SHA}.apk"
          fi
          if [ "${GOOGLE_AUTH_STATUS:-ok}" = "missing" ]; then
            NAME="${NAME%.apk}-nogoogle.apk"
            echo "::warning::APK tagged ${NAME} - built without Google sign-in (GOOGLE_SERVER_CLIENT_ID empty)"
          fi
          cp build/app/outputs/flutter-apk/app-release.apk "dist/${NAME}"
          echo "APK_NAME=${NAME}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: dist/*.apk

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*.apk
          generate_release_notes: true
