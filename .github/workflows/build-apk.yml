name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.1"
          cache: true

      # C1: .env is never bundled (pubspec has no `.env` asset) and never
      # committed. Secrets reach the app via --dart-define at build time.
      - name: Assert no .env asset + backend RLS guards
        run: |
          if grep -qE '^\s*-\s*\.env\s*$' pubspec.yaml; then
            echo "::error::pubspec.yaml still bundles .env as a Flutter asset (C1). Remove it."
            exit 1
          fi
          if [ ! -f supabase/migrations/0001_rls.sql ]; then
            echo "::error::Missing supabase/migrations/0001_rls.sql (H11)."
            exit 1
          fi
          grep -q 'auth.uid()' supabase/migrations/0001_rls.sql || {
            echo "::error::RLS migration lacks auth.uid() policies (H11)."
            exit 1
          }
          if grep -q 'READ_EXTERNAL_STORAGE\|WRITE_EXTERNAL_STORAGE\|MANAGE_EXTERNAL_STORAGE\|requestLegacyExternalStorage' android/app/src/main/AndroidManifest.xml; then
            echo "::error::AndroidManifest still requests broad storage (H7)."
            exit 1
          fi
          grep -q 'key.properties' android/app/build.gradle || {
            echo "::error::android/app/build.gradle lacks key.properties release signing (C4)."
            exit 1
          }

      # Update-check CI guard: every v* tag must match the version in
      # pubspec.yaml. The app's update engine (lib/services/update/) compares
      # GitHub release tags against the running version, so a mismatched tag
      # would ship a release the app can never detect. Build number (+N) is
      # not compared (convention: every user-facing release bumps semver).
      - name: Assert v* tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME}"
          SEMVER="${TAG#v}"
          if ! [[ "$SEMVER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${TAG}' is not strict semver (expected vMAJOR.MINOR.PATCH, e.g. v1.2.0). The update-check engine rejects non-semver tags."
            exit 1
          fi
          PUBSPEC_VERSION="$(grep -m1 -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//' | tr -d '"' | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')"
          if [ -z "$PUBSPEC_VERSION" ]; then
            echo "::error::Could not read a strict-semver 'version:' from pubspec.yaml."
            exit 1
          fi
          if [ "$SEMVER" != "$PUBSPEC_VERSION" ]; then
            echo "::error::Tag '${TAG}' (${SEMVER}) does not match pubspec.yaml version (${PUBSPEC_VERSION}). Bump pubspec version to ${SEMVER} or fix the tag. Build number (+N) is not compared."
            exit 1
          fi
          echo "Tag guard OK: ${TAG} == pubspec version ${PUBSPEC_VERSION}"

      - name: Validate secrets (no .env file written)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # M21: trim all env — whitespace/newlines stripped, log lengths-only (never values)
          # Use xargs trimming for each
          SUPABASE_URL_TRIMMED="$(echo "$SUPABASE_URL" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | tr -d '\r')"
          SUPABASE_URL_TRIMMED="$(echo "$SUPABASE_URL_TRIMMED" | xargs)"
          SUPABASE_PUBLISHABLE_KEY_TRIMMED="$(echo "$SUPABASE_PUBLISHABLE_KEY" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | tr -d '\r' | xargs)"
          GOOGLE_SERVER_CLIENT_ID_TRIMMED="$(echo "$GOOGLE_SERVER_CLIENT_ID" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | tr -d '\r' | xargs)"
          GROQ_API_KEY_TRIMMED="$(echo "$GROQ_API_KEY" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | tr -d '\r' | xargs)"
          HF_TOKEN_TRIMMED="$(echo "$HF_TOKEN" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | tr -d '\r' | xargs)"

          echo "SUPABASE_URL_TRIMMED=${SUPABASE_URL_TRIMMED}" >> "$GITHUB_ENV"
          echo "SUPABASE_PUBLISHABLE_KEY_TRIMMED=${SUPABASE_PUBLISHABLE_KEY_TRIMMED}" >> "$GITHUB_ENV"
          echo "GOOGLE_SERVER_CLIENT_ID_TRIMMED=${GOOGLE_SERVER_CLIENT_ID_TRIMMED}" >> "$GITHUB_ENV"
          echo "GROQ_API_KEY_TRIMMED=${GROQ_API_KEY_TRIMMED}" >> "$GITHUB_ENV"
          echo "HF_TOKEN_TRIMMED=${HF_TOKEN_TRIMMED}" >> "$GITHUB_ENV"

          # Lengths-only logging (never values) — M21
          echo "env lengths — SUPABASE_URL:${#SUPABASE_URL_TRIMMED} SUPABASE_PUBLISHABLE_KEY:${#SUPABASE_PUBLISHABLE_KEY_TRIMMED} GOOGLE_SERVER_CLIENT_ID:${#GOOGLE_SERVER_CLIENT_ID_TRIMMED} GROQ:${#GROQ_API_KEY_TRIMMED} HF:${#HF_TOKEN_TRIMMED}"

          if [ -z "$SUPABASE_URL_TRIMMED" ]; then
            echo "::error::Missing SUPABASE_URL secret (after trim)"
            exit 1
          fi
          if [ -z "$SUPABASE_PUBLISHABLE_KEY_TRIMMED" ]; then
            echo "::warning::SUPABASE_PUBLISHABLE_KEY empty after trim"
          fi

          if [ -z "$GOOGLE_SERVER_CLIENT_ID_TRIMMED" ]; then
            echo "::warning::GOOGLE_SERVER_CLIENT_ID secret empty after trim - Google sign-in will report 'not configured'"
            echo "GOOGLE_AUTH_STATUS=missing" >> "$GITHUB_ENV"
          elif [[ "$GOOGLE_SERVER_CLIENT_ID_TRIMMED" != *.apps.googleusercontent.com ]]; then
            echo "::error::GOOGLE_SERVER_CLIENT_ID malformed after trim (must end with .apps.googleusercontent.com)"
            echo "GOOGLE_AUTH_STATUS=invalid" >> "$GITHUB_ENV"
          else
            echo "GOOGLE_AUTH_STATUS=ok" >> "$GITHUB_ENV"
          fi

      # C4: restore release keystore from CI secrets (placeholder when absent
      # for local debug-style builds is handled by build.gradle fallback).
      - name: Restore release keystore (C4)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
            echo "RELEASE_SIGNING=keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret - release will fall back to debug keys (local only). Configure the keystore for store builds. See docs/backend-rls.md."
            echo "::notice::Google Sign-In requires a STABLE signing key: every debug-fallback run generates a new key, so no OAuth Android client SHA-1 can ever match."
            echo "RELEASE_SIGNING=debug-fallback" >> "$GITHUB_ENV"
          fi

      - name: Assert release signing (C4)
        run: |
          if [ "${RELEASE_SIGNING:-debug-fallback}" != "keystore" ]; then
            # A debug-fallback build gets a NEW random debug key on every run.
            # That breaks Google Sign-In (no OAuth Android client can match a
            # per-build SHA-1 -> "[16] Account reauth failed") and makes APK
            # updates impossible (signature mismatch). Never ship that.
            if [ "${GOOGLE_AUTH_STATUS:-missing}" = "ok" ]; then
              echo "::error::Google sign-in is configured, but no release keystore is set. Debug-fallback builds are signed with a random key per run: Google Sign-In fails with '[16] Account reauth failed' and APK updates are rejected. Add ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD secrets (see docs/google-signin-setup.md)."
              exit 1
            fi
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "::warning::main build without release keystore (debug fallback). Tag/release builds require the keystore."
            fi
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* ]] && [ "${RELEASE_SIGNING:-debug-fallback}" != "keystore" ]; then
            echo "::error::Tag builds must use a real release keystore (C4). Add ANDROID_KEYSTORE_* secrets."
            exit 1
          fi

      - run: flutter pub get
      - name: Validate Google auth config
        run: |
          # H9: fail on main if GOOGLE_SERVER_CLIENT_ID missing/invalid (no nogoogle artifact on main)
          # Allow on PR/dispatch with warning. Keep v* tag behavior: also fail if invalid/missing (tags deploy)
          REF="${{ github.ref }}"
          EVENT="${{ github.event_name }}"
          STATUS="${GOOGLE_AUTH_STATUS:-missing}"
          echo "Validate Google — ref=$REF event=$EVENT status=$STATUS"
          if [ "$STATUS" = "invalid" ]; then
            echo "::error::Refusing to ship with malformed GOOGLE_SERVER_CLIENT_ID. Fix the secret (Web client, see docs/google-signin-setup.md)."
            exit 1
          fi
          if [ "$STATUS" = "missing" ]; then
            if [ "$REF" = "refs/heads/main" ]; then
              echo "::error::Refusing to ship main with missing GOOGLE_SERVER_CLIENT_ID — no nogoogle artifact on main (H9). Set the secret."
              exit 1
            fi
            if [[ "$REF" == refs/tags/v* ]]; then
              echo "::error::Refusing to ship tag $REF with missing GOOGLE_SERVER_CLIENT_ID."
              exit 1
            fi
            echo "::warning::Building without Google sign-in (GOOGLE_SERVER_CLIENT_ID empty) — allowed on PR/dispatch only, APK will be -nogoogle."
          fi
      - run: flutter analyze
      - name: Run tests (M15)
        run: |
          # Fail if zero tests collected — ensures smoke_test.dart exists
          TEST_OUT="$(flutter test --reporter=expanded 2>&1)"
          echo "$TEST_OUT"
          # Check for "No tests" or 0 passed
          if echo "$TEST_OUT" | grep -q "No tests"; then
            echo "::error::No tests found — add test/smoke_test.dart (M15)"
            exit 1
          fi
          # Ensure at least one test passed
          if ! echo "$TEST_OUT" | grep -q "All tests passed"; then
            echo "::error::flutter test did not report All tests passed"
            exit 1
          fi

      - name: Build APK (dart-define secrets, C1)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          GEMMA_MODEL_URL: ${{ secrets.GEMMA_MODEL_URL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # M21: trim all dart-defines (use trimmed env from earlier step)
          MINIMAX_API_KEY_TRIMMED="$(echo "$MINIMAX_API_KEY" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | tr -d '\r' | xargs)"
          KAGGLE_USERNAME_TRIMMED="$(echo "$KAGGLE_USERNAME" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | tr -d '\r' | xargs)"
          KAGGLE_KEY_TRIMMED="$(echo "$KAGGLE_KEY" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | tr -d '\r' | xargs)"
          GEMMA_MODEL_URL_TRIMMED="$(echo "$GEMMA_MODEL_URL" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | tr -d '\r' | xargs)"
          flutter build apk --release \
            --dart-define=GROQ_API_KEY="${GROQ_API_KEY_TRIMMED:-$GROQ_API_KEY}" \
            --dart-define=MINIMAX_API_KEY="$MINIMAX_API_KEY_TRIMMED" \
            --dart-define=KAGGLE_USERNAME="$KAGGLE_USERNAME_TRIMMED" \
            --dart-define=KAGGLE_KEY="$KAGGLE_KEY_TRIMMED" \
            --dart-define=GEMMA_MODEL_URL="$GEMMA_MODEL_URL_TRIMMED" \
            --dart-define=HF_TOKEN="${HF_TOKEN_TRIMMED:-$HF_TOKEN}" \
            --dart-define=SUPABASE_URL="${SUPABASE_URL_TRIMMED:-$SUPABASE_URL}" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="${SUPABASE_PUBLISHABLE_KEY_TRIMMED:-$SUPABASE_PUBLISHABLE_KEY}" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="${GOOGLE_SERVER_CLIENT_ID_TRIMMED:-}"

      - name: Rename APK
        run: |
          mkdir -p dist
          TAG="${GITHUB_REF_NAME}"
          SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            NAME="AgentA-${TAG}.apk"
          else
            NAME="AgentA-${SHA}.apk"
          fi
          if [ "${GOOGLE_AUTH_STATUS:-ok}" = "missing" ]; then
            # H9: no nogoogle artifact on main/tags — we already failed above, this only fires on PR/dispatch
            if [[ "$GITHUB_REF" == refs/heads/main ]] || [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::Unexpected nogoogle on main/tag after guard — failing"
              exit 1
            fi
            NAME="${NAME%.apk}-nogoogle.apk"
            echo "::warning::APK tagged ${NAME} - built without Google sign-in (GOOGLE_SERVER_CLIENT_ID empty) — PR/dispatch only"
          fi
          cp build/app/outputs/flutter-apk/app-release.apk "dist/${NAME}"
          echo "APK_NAME=${NAME}" >> "$GITHUB_ENV"

      - name: Report APK signing fingerprint (C4)
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BT="$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1)"
          {
            echo "## APK signing certificate"
            echo ""
            echo '```'
            if [ -n "$BT" ] && [ -x "$BT/apksigner" ]; then
              "$BT/apksigner" verify --print-certs "$APK" | grep -Ei 'Signer #|certificate SHA-1 digest|certificate SHA-256 digest'
            else
              keytool -printcert -jarfile "$APK" | grep -E 'SHA1:|SHA256:'
            fi
            echo '```'
            echo "Register this SHA-1 as an **Android** OAuth client for package \`com.agenta.AgentA\`"
            echo "(Google Cloud Console > Credentials > Create OAuth client ID > Android). Otherwise"
            echo "Google Sign-In fails with \`[16] Account reauth failed\` because the app's signing"
            echo "key is not authorized. Signing uses the ANDROID_KEYSTORE_* secrets, so this"
            echo "fingerprint is now stable across builds."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$BT" ] && [ -x "$BT/apksigner" ]; then
            "$BT/apksigner" verify --print-certs "$APK" \
              | grep -Ei 'certificate SHA-1 digest|certificate SHA-256 digest' \
              | while read -r line; do echo "::notice::$line"; done
          fi

      # Release FIRST: publishes dist/*.apk directly from the workspace, so it
      # does NOT consume artifact-storage quota and runs whenever the build
      # succeeded — independent of the artifact upload below (which can fail
      # on quota recalculation windows without blocking the release).
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*.apk
          generate_release_notes: true

      # Short retention: promotion downloads the artifact minutes after the
      # build, so 3 days is plenty. Prevents artifact-storage quota exhaustion
      # (30 artifacts x ~117MB previously hit the 90-day-retention quota).
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ env.APK_NAME }}
          path: dist/*.apk
          retention-days: 3
