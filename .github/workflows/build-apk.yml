name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.1"
          cache: true

      - name: Create .env
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          GEMMA_MODEL_URL: ${{ secrets.GEMMA_MODEL_URL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::Missing SUPABASE_URL secret"
            exit 1
          fi
          cat > .env <<EOF
          GROQ_API_KEY=$GROQ_API_KEY
          MINIMAX_API_KEY=$MINIMAX_API_KEY
          KAGGLE_USERNAME=$KAGGLE_USERNAME
          KAGGLE_KEY=$KAGGLE_KEY
          GEMMA_MODEL_URL=$GEMMA_MODEL_URL
          HF_TOKEN=$HF_TOKEN
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY
          GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID
          EOF

      - run: flutter pub get
      - run: flutter analyze || true
      - run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p dist
          TAG="${GITHUB_REF_NAME}"
          SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            NAME="AgentA-${TAG}.apk"
          else
            NAME="AgentA-${SHA}.apk"
          fi
          cp build/app/outputs/flutter-apk/app-release.apk "dist/${NAME}"
          echo "APK_NAME=${NAME}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: dist/*.apk

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*.apk
          generate_release_notes: true
