name: Promote to Landing (latest)

# Option B cross-repo auto-promotion:
# Every successful "Build APK" run on main automatically publishes its APK as the
# stable `AgentA.apk` asset on the rolling `latest` release of the public landing
# repo (Shuash11/AgentA-landing), then patches the version pill in index.html so
# Vercel auto-deploys. No manual `gh run download` needed.
#
# REQUIRED SECRET — LANDING_RELEASE_PAT (never hardcode the value here):
#   - Type: fine-grained Personal Access Token, scoped ONLY to
#     Shuash11/AgentA-landing (Repository access: "Only select repositories").
#   - Permissions on that repo: Contents read+write, Releases read+write.
#   - Add it at: AgentA repo > Settings > Secrets and variables > Actions >
#     New repository secret > Name = LANDING_RELEASE_PAT.
#   - Rotation: create a replacement token (same scope), update the secret value,
#     then revoke the old token. No workflow change needed (reference by name).
#   - Same-repo reads (artifact download) keep using the built-in GITHUB_TOKEN;
#     only cross-repo landing writes use the PAT.
#
# ROLLING RELEASE: tag `latest` on Shuash11/AgentA-landing (created if missing).
# Public URL stays stable:
#   https://github.com/Shuash11/AgentA-landing/releases/latest/download/AgentA.apk
# Existing v* tag releases in THIS repo are untouched (see build-apk.yml).

"on":
  workflow_run:
    workflows: ["Build APK"]
    types: [completed]
    # No `branches` filter: workflow_run does not support a `tags` filter, and
    # restricting to main would exclude v* tag runs. Tag-awareness is enforced
    # in the job `if` below (head_branch is 'main' for branch runs, the tag
    # name e.g. 'v1.2.0' for tag runs) — tagged releases, the ones the in-app
    # update engine detects, now also promote to the landing.

# `actions: read` covers reading workflow runs + downloading their artifacts.
# `contents: read` is REQUIRED for same-repo release reads: a permissions block
# revokes all unlisted scopes, and the release-fallback `gh release download` /
# `gh release list` calls use GITHUB_TOKEN (without contents: read, GitHub
# returns 404 "release not found" for release downloads on a private repo).
# Landing cross-repo WRITES keep using the landing-scoped LANDING_RELEASE_PAT
# (unchanged — separate PAT permissions).
permissions:
  actions: read
  contents: read

# Serialize promotions to the rolling `latest` target so rapid pushes queue
# instead of interleaving (cancel-in-progress: false = queue, not cancel).
concurrency:
  group: promote-landing
  cancel-in-progress: false

env:
  LANDING_REPO: Shuash11/AgentA-landing
  ROLLING_TAG: latest
  STABLE_ASSET: AgentA.apk

jobs:
  promote:
    # Promote green main-branch builds AND successful v* tag runs (head_branch
    # carries the tag name like 'v1.2.0' on workflow_run tag events). Failures
    # and PR/dispatch runs are ignored.
    if: ${{ github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.head_branch == 'main' || startsWith(github.event.workflow_run.head_branch, 'v')) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      # contents: read is also required here for the same-repo release fallback
      # (gh release download / gh release list) — see workflow-level note.
      contents: read
    steps:
      - name: Guard required secret
        id: guard
        env:
          PAT: ${{ secrets.LANDING_RELEASE_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::warning::LANDING_RELEASE_PAT not set — skipping promotion (not a failure). Add a fine-grained PAT scoped only to Shuash11/AgentA-landing (Contents read+write, Releases read+write) under AgentA repo Settings > Secrets and variables > Actions to enable auto-promotion."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Download build artifact from triggering run
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID="${{ github.event.workflow_run.id }}"
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"
          SHA7="$(echo "$HEAD_SHA" | cut -c1-7)"
          echo "SHA7=${SHA7}" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%m-%d)" >> "$GITHUB_ENV"
          echo "Triggering run: $RUN_ID @ $HEAD_SHA (head_branch: $HEAD_BRANCH)"
          rm -rf ./artifacts && mkdir -p ./artifacts
          # Artifact name is dynamic (AgentA-<SHA7>.apk, maybe -nogoogle suffix).
          # Primary source: the run artifact. Quota-sensitive (GitHub storage
          # recalculation lag can make uploads succeed-but-publish-nothing), so
          # failure here must not abort the step.
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern "AgentA-*.apk" --dir ./artifacts \
            || gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir ./artifacts \
            || echo "Artifact download failed for run $RUN_ID — trying release fallback"
          echo "--- artifacts ---"
          find ./artifacts | sort
          SRC="$(find ./artifacts -type f -name 'AgentA-*.apk' | head -n 1)"
          SRC_SOURCE=""
          if [ -n "$SRC" ]; then
            SRC_SOURCE="artifact"
            echo "Primary source: downloaded artifact from run $RUN_ID"
          else
            # Fallback source: the GitHub release (published directly from the
            # build workspace, quota-independent). Releases only exist for v*
            # tag runs, so main runs fall back to the newest v* release.
            if [[ "$HEAD_BRANCH" == v* ]]; then
              # Tag run: the release for this exact tag exists (build-apk.yml
              # publishes it before artifact upload).
              if gh release download "$HEAD_BRANCH" --repo "$GITHUB_REPOSITORY" --pattern "AgentA-*.apk" --dir ./artifacts; then
                SRC="$(find ./artifacts -type f -name 'AgentA-*.apk' | head -n 1)"
                if [ -n "$SRC" ]; then
                  SRC_SOURCE="release-${HEAD_BRANCH}"
                  echo "fallback: downloaded from release ${HEAD_BRANCH}"
                fi
              fi
            else
              # Main run: no release exists for main commits. Serve the newest
              # v* release's APK (better a recent release than nothing). This
              # may be from an OLDER commit than the triggering run — log it
              # as a warning so staleness stays visible.
              # No silent error swallow here: a read-restricted token surfaces
              # as 404 "not found" on private-repo releases, so real
              # permission/API errors must fail loudly. Only an empty list
              # ("no v* release exists") is a tolerated no-op (falls through to
              # the final ::error:: below). `// empty` normalizes the empty-list
              # jq result so no bogus "null" download is attempted.
              if ! NEWEST_VTAG="$(gh release list --repo "$GITHUB_REPOSITORY" --json tagName --jq '[.[] | select(.tagName | test("^v"))] | .[0].tagName // empty')"; then
                echo "::error::gh release list failed for $GITHUB_REPOSITORY — cannot read releases for the main-run fallback (permission or API error)."
                exit 1
              fi
              if [ -n "$NEWEST_VTAG" ] && gh release download "$NEWEST_VTAG" --repo "$GITHUB_REPOSITORY" --pattern "AgentA-*.apk" --dir ./artifacts; then
                SRC="$(find ./artifacts -type f -name 'AgentA-*.apk' | head -n 1)"
                if [ -n "$SRC" ]; then
                  SRC_SOURCE="release-${NEWEST_VTAG}"
                  echo "fallback: downloaded from release ${NEWEST_VTAG}"
                  echo "::warning::Main run $RUN_ID has no artifact and no release; promoting newest v* release ${NEWEST_VTAG} instead. Its APK may be from an OLDER commit than $HEAD_SHA (no release for main commits) — staleness accepted for availability."
                fi
              fi
            fi
          fi
          if [ -z "$SRC" ]; then
            echo "::error::No AgentA-*.apk artifact found in run $RUN_ID and no release fallback yielded an APK (checked trigger branch/tag releases)."
            exit 1
          fi
          echo "source=${SRC_SOURCE}" >> "$GITHUB_OUTPUT"
          echo "SRC_APK=${SRC}" >> "$GITHUB_ENV"
          echo "APK source: ${SRC_SOURCE}"
          ls -lh "$SRC"

      - name: Guard nogoogle not promoted to stable (H9)
        if: steps.guard.outputs.skip != 'true'
        run: |
          SRC="${{ env.SRC_APK }}"
          if echo "$SRC" | grep -q "\-nogoogle\.apk$"; then
            echo "::error::Refusing to promote -nogoogle artifact to stable ${{ env.STABLE_ASSET }} (H9). Main builds must have GOOGLE_SERVER_CLIENT_ID. This promotion is blocked."
            echo "Promote landing refuses -nogoogle for stable asset — fix GOOGLE_SERVER_CLIENT_ID on main and rebuild."
            exit 1
          fi
          echo "Promote guard passed — SRC is not nogoogle: $SRC"

      - name: Prepare stable + dated assets
        if: steps.guard.outputs.skip != 'true'
        run: |
          cp "${{ env.SRC_APK }}" "./${{ env.STABLE_ASSET }}"
          cp "${{ env.SRC_APK }}" "./AgentA-${{ env.SHA7 }}.apk"
          ls -lh ./*.apk

      - name: Upload to landing rolling release (retry for ~283MB)
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.LANDING_RELEASE_PAT }}
        run: |
          set -u
          # Create rolling release if missing (idempotent).
          if ! gh release view "$ROLLING_TAG" --repo "$LANDING_REPO" >/dev/null 2>&1; then
            gh release create "$ROLLING_TAG" --repo "$LANDING_REPO" \
              --title "Latest build" \
              --notes "Rolling stable build promoted automatically from AgentA main. Download: AgentA.apk"
          fi
          # Upload the single stable asset with clobber (no duplicate pile-up).
          for i in 1 2 3; do
            echo "Upload attempt $i: $STABLE_ASSET"
            if gh release upload "$ROLLING_TAG" "./$STABLE_ASSET" --clobber --repo "$LANDING_REPO"; then
              break
            fi
            if [ "$i" = "3" ]; then
              echo "::error::Stable asset upload failed after 3 attempts"
              exit 1
            fi
            sleep $((i * 15))
          done
          # Optional dated copy for rollback visibility, then prune to newest 2.
          gh release upload "$ROLLING_TAG" "./AgentA-${{ env.SHA7 }}.apk" --clobber --repo "$LANDING_REPO" || true
          echo "--- assets after upload ---"
          gh release view "$ROLLING_TAG" --repo "$LANDING_REPO" --json assets --jq '.assets[] | "\(.name)\t\(.createdAt)\t\(.size)"' || true

          RELEASE_API="repos/$LANDING_REPO/releases/tags/$ROLLING_TAG"
          DATED_JQ='[.[] | select(.name | test("^AgentA-[0-9a-f]{7}(-nogoogle)?\\.apk$"))]'
          DATED_COUNT="$(gh api "$RELEASE_API" --jq "(.assets | $DATED_JQ) | length")"
          echo "Dated assets on $ROLLING_TAG: $DATED_COUNT"
          if [ -z "$DATED_COUNT" ]; then
            echo "::error::Could not list release assets (gh api failed)"
            exit 1
          fi
          if [ "$DATED_COUNT" -gt 2 ]; then
            PRUNE_LIST="$(gh api "$RELEASE_API" --jq "(.assets | $DATED_JQ) | sort_by(.created_at) | .[0:(length-2)] | .[].name")"
            if [ -z "$PRUNE_LIST" ]; then
              echo "::error::Prune expected $((DATED_COUNT-2)) deletions but got an empty list"
              exit 1
            fi
            echo "$PRUNE_LIST" | while read -r OLD; do
              [ -n "$OLD" ] || continue
              echo "Pruning old dated asset: $OLD"
              gh release delete-asset "$ROLLING_TAG" "$OLD" --yes --repo "$LANDING_REPO" || true
            done
            REMAINING="$(gh api "$RELEASE_API" --jq "(.assets | $DATED_JQ) | length")"
            if [ "$REMAINING" -gt 2 ]; then
              echo "::error::Prune failed: $REMAINING dated assets remain (policy: newest 2)"
              exit 1
            fi
          else
            echo "Nothing to prune (<= 2 dated copies)."
          fi

      - name: Verify public download URL + freshness
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CODE="$(curl -sSL -o /dev/null -w '%{http_code}' -f "https://github.com/${{ env.LANDING_REPO }}/releases/latest/download/${{ env.STABLE_ASSET }}")"
          test "$CODE" = "200"
          # Staleness check: the rolling release's stable asset must be the
          # just-uploaded file. HTTP 200 alone cannot detect a stale asset
          # (the Sep-13 build served 200 for 8 days). Compare byte sizes.
          LOCAL_SIZE="$(stat -c '%s' "./${{ env.STABLE_ASSET }}")"
          REMOTE_JSON="$(gh api "repos/${{ env.LANDING_REPO }}/releases/tags/${{ env.ROLLING_TAG }}" --jq '.assets[] | select(.name == "'"${{ env.STABLE_ASSET }}"'") | "\(.size)\t\(.updatedAt)"')"
          if [ -z "$REMOTE_JSON" ]; then
            echo "::error::Freshness check failed: stable asset ${{ env.STABLE_ASSET }} not found on ${{ env.ROLLING_TAG }} (HTTP was $CODE)."
            exit 1
          fi
          REMOTE_SIZE="$(echo "$REMOTE_JSON" | cut -f1)"
          REMOTE_UPDATED="$(echo "$REMOTE_JSON" | cut -f2)"
          if [ "$LOCAL_SIZE" != "$REMOTE_SIZE" ]; then
            echo "::error::Freshness check failed: ${{ env.STABLE_ASSET }} on ${{ env.ROLLING_TAG }} is STALE — local size ${LOCAL_SIZE} bytes vs remote ${REMOTE_SIZE} bytes (updatedAt ${REMOTE_UPDATED})."
            exit 1
          fi
          echo "Freshness OK: ${{ env.STABLE_ASSET }} local=${LOCAL_SIZE} remote=${REMOTE_SIZE} bytes (updatedAt ${REMOTE_UPDATED})"

      - name: Checkout landing repo
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          repository: Shuash11/AgentA-landing
          token: ${{ secrets.LANDING_RELEASE_PAT }}
          path: landing
          ref: main

      - name: Patch version pill (CSP-safe static HTML, 1-line diff)
        if: steps.guard.outputs.skip != 'true'
        run: |
          SHA7="${{ env.SHA7 }}"
          BUILD_DATE="${{ env.BUILD_DATE }}"
          if [ -z "$SHA7" ]; then LABEL="Android • latest"; else LABEL="latest • ${BUILD_DATE} • ${SHA7}"; fi
          echo "Pill label: $LABEL"
          python3 - "$LABEL" <<'EOF'
          import re, sys, pathlib
          label = sys.argv[1]
          p = pathlib.Path("landing/index.html")
          s = p.read_text(encoding="utf-8")
          new, n = re.subn(r'(<div class="pill">.*?<b>).*?(</b>\s*</div>)', rf'\1{label}\2', s, count=1, flags=re.DOTALL)
          if n == 0:
              print("::error::pill div not found in landing/index.html")
              raise SystemExit(1)
          p.write_text(new, encoding="utf-8")
          print(f"pill patched ({n} line block)")
          EOF
          git -C landing diff -- index.html | head -n 30

      - name: Commit + push pill (triggers Vercel auto-deploy)
        if: steps.guard.outputs.skip != 'true'
        run: |
          cd landing
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "Pill unchanged, nothing to commit."
            exit 0
          fi
          git add index.html
          git commit -m "chore: promote ${{ env.SHA7 }} (${{ env.BUILD_DATE }})"
          git push origin main
