    LiteRtLmEngine()]", verified 2026-10-31); NO engine-registration change
    this cycle (plan §1.6, §5-P1 item 2). MediaPipeEngine claims this spec.
  engine_choice_rationale: >-
    the MediaPipe .task engine is the only engine PROVEN on the user's
    (non-arm64) device class — the old 1B .task ran fine there while the
    LiteRT-LM stack is PROVEN-BROKEN there (arm64-only native stack,
    litertlm 1.8.6, cycle-40; plan header constraint 3, §1.4). The cycle-40
    byte-scan proves the MediaPipe llm jni ships for armeabi-v7a AND x86_64
    — .task is the multi-ABI engine (plan §1.6).
  model_type: ModelType.qwen            # pinned core 1.11.4 — pub-cache flutter_edge_ai-1.11.4/lib/core/model.dart:6 (plan §1.6); the plugin docs' ModelType table maps Qwen 2.5 → ModelType.qwen (plan §1.6)
  file_type: ModelFileType.task         # ".task files — MediaPipe handles chat templates internally" (pinned core model.dart:15, plan §1.6); selects the ENGINE — never inferred from a filename (the E2B contract §2 file_type discipline carries)
  enum_completeness: >-
    the pinned core enum (general, gemmaIt, gemma4, deepSeek, qwen, qwen3,
    llama, hammer, functionGemma, phi) already contains BOTH values — NO
    package change (plan §1.6).
  dependency: NONE_ADDED
  dependency_note: >-
    no new package enters pubspec; the three engine pins stay untouched —
    flutter_edge_ai ^1.11.4 (:21), flutter_edge_ai_mediapipe ^1.0.8 (:22),
    flutter_edge_ai_litertlm 1.8.6 (:24) (pubspec.yaml, verified
    2026-10-31; plan §1.6). Divergence = STOP S1 (plan §6).
  install_shape: >-
    MIRRORS the E2B contract §2 install_shape with the SPEC-DRIVEN
    substitution: BOTH install chains (lib/services/ai/
    model_download_service.dart:344-345 and :574-575 — currently hardcoded
