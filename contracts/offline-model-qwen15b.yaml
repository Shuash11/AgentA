    superseded there). The E2B ASSET stays at source — P3's Shard B
    re-verifies it unchanged even though unselected (plan §5-P3 Shard B).
    Future opt-in under the plugin's one-active-model constraint is the
    cycle-38 F8 lineage (plan §2 F8) — backlog, future cycle.
  consumers: >-
    the resolved spec feeds: both install chains (§2 install_shape), the
    identity sites (§2 identity_sites), the gate/download/card/picker
    states (§6), and the migration trigger (§4) — now from the SINGLE
    class. Consumer sites as recorded at v1.0.0 (verified 2026-10-31:
    main.dart:551 the gate, download_prompt_screen.dart:101 the screen,
    chats.dart:645 the card, model_picker_sheet.dart:36 the picker) —
    re-verify at P2b per the header anchor policy.
  supersedes: >-
    the per-class phrasing recorded at v1.0.0 elsewhere in this file is
    SUPERSEDED by THIS table (kept in place as the P2-era record; those
    sections' figures, shapes, anchors and strings are otherwise
    UNCHANGED): §2 identity_invariant's "'qwen2.5-1.5b-it' on the fallback
    class, 'gemma-4-e2b-it' on the E2B class" → the identity is
    'qwen2.5-1.5b-it' APP-WIDE, message-only row included; §6
    gate_size_chip's e2b_class row ('~2.6GB') → the '~1.6GB' chip is
    UNIVERSAL (no E2B class in selection); §6 picker_chat_card_states'
    arm64_primary/fallback_class enumeration → the SINGLE class's
    affordances (its own "per the §3 table" deference inherits this
    amendment); §7 failure_classes'
    "non-arm64-ineligible / < 4 GB case" reason → the RAM-only wording
