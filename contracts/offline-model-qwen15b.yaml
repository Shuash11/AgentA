# 4b. Migration contract v5 — the LOAD-PATH reconciliation (cycle-44 plan
#     §5-P2 Rulings 1-3 + 6 — BINDING; as built and verified against this
#     tree 2026-11-01). The v3/v4 asset-presence lesson, state-keyed; the
#     marker-first pattern is RULED AWAY here (see marker_semantics).
# ---------------------------------------------------------------------------

migration_v5:
  owner: >-
    lib/services/ai/model_download_service.dart — the shared helper
    _reconcileSelectedSpecIfPresent() (:309-393), invoked from BOTH seams
    so they can never disagree about the state: the GATE seam
    checkModelExists() (:467-523 — after the v3/v4 calls :476-477, BEFORE
    the readiness read :485 — the v3 §4.8 call-site precedent) and the
    LOAD seam ensureModelActive() (:990-1024 — after the three v2/v3/v4
    migrations :991-993, per Ruling 1 site 1 step 1).
  marker: "model_asset_v5"              # a SharedPreferences bool — read :317, written :384 ONLY after verified-clean (marker_semantics below)
  plugin_seam: >-
    cycle-44 reads every plugin probe through ONE seam — the
    OfflineModelPlugin abstraction (:36-61) with the production
    FlutterEdgeAiModelPlugin (:68-114) and a @visibleForTesting override
    (:215-219) — so the gate and load seams read the SAME facts. EVERY
    wrapped read answers UNKNOWN (null) when the plugin cannot be reached,
    never "no models"/"false-clean": an UNREAD state is not a clean state,
    and the repair must never turn an unknown into a destructive decision
    (see the_unknown_doctrine below).
  filename_derivation: >-
    the selected asset's persisted filename is selectedFileNameFor(spec)
    (:237-240) = Uri.parse(resolvedModelUrlFor(spec)).pathSegments.last —
    the plugin's OWN derivation (the install builder takes the model
    file's name from the source URL's last path segment and uses it as
    BOTH the download target and the persisted model id, so the app's
    selected filename and the plugin's model id are the SAME string; the
    plan §5-P2 Ruling 1 allowed either package:path's basename or
    pathSegments.last — the derived string is what matters). The
    AppConfig.gemmaModelUrl override derives the same way (resolvedModelUrlFor,
    :197-198), so the override stays legal. An EMPTY result (a URL with no
    file name) is an UNKNOWN state: the reconciliation never sweeps (every
    id would look foreign) and never marks (:314-316).
  identity_comparison: >-
    THE IDENTITY-COMPARISON RULE (cycle-44 P2, ruled in the P2 report and
    recorded per the delegation — plan §5-P2's raw-string sketch is
    superseded by THIS rule): the pinned plugin (flutter_edge_ai 1.11.4)
    names a model in TWO representations — the RESTORE path rebuilds the
    active spec from the persisted FILENAME (mobile_model_manager.dart
    :215-220), so the active spec's name is `model.task`; the INSTALL path
    names the spec after the EXTENSION-STRIPPED basename
    (inference_installation_builder.dart:419 — FileNameUtils.getBaseName),
    so it is `model`. Both name the SAME file. The comparison is therefore
    IDENTITY-BASED, never a raw-string equality: isSameModelIdentity
    (candidate, fileName) (:264-268) matches equal strings OR the
    candidate being the plugin-baseName of the fileName (_pluginBaseName
    :273-279 — strips the supported extensions in the plugin's own order).
    ONE-DIRECTIONAL (ruled): the candidate may be the stripped form of
    fileName, but a candidate carrying a DIFFERENT extension is a
    different model and never matches. A raw-string comparison would call
    the app's own freshly installed model "foreign" and clear a healthy
    identity (and re-run the install chain on every load) — the rule
    exists to prevent exactly that.
  trigger: >-
    THREE STATE-KEYED LEGS (the v3/v4 lesson BINDING: keys on the actual
    state, never a generic has-model condition), evaluated from the plugin
    facts read ONCE per pass (:319-343):
    (a) the FOREIGN-FILE leg — listInstalledModels() (the ids ARE the
    persisted filenames) contains any id whose identity is not the derived
    selected filename (:326-328); when spec == null (the message-only
    class) EVERY id is foreign — the class holds no legal asset (§3
    message_only_class, §4.10).
    (b) the FOREIGN-ACTIVE leg — hasActiveModel() AND the active spec's
    identity is not the selected filename (:330-332).
    (c) THE LIE leg — the DAO row claims installed (OfflineModelDao()
    .isModelInstalled(), offline_model_dao.dart:166-178) AND the plugin's
    file probe says the selected file is NOT installed
    (isModelInstalled(selectedFileName) — the filename key) AND the active
    identity is not the selected filename (:334-343). THE COMPOSITE PROBE
    IS NORMATIVE: BOTH plugin probes must agree the selected asset is gone
    before the DAO is touched — a single lying probe can then never loop
    the download (after a real install the restore re-activates the
    selected file, making the third conjunct false; the lie-isolation is
    test-proven both ways — a lying file probe alone never resets the row,
    a lying active probe alone never resets it). Timing verified safe: the
    restore is awaited inside the plugin's initialize() and the app awaits
    initialize() pre-gate (main.dart:181, verified 2026-11-01), so
    activeModelSpec is meaningful at the seam (plan §5-P2 Ruling 2).
  body:                                 # ORDER IS NORMATIVE — as built :349-384
    - >-
      1. SWEEP (leg a) — for every foreign id: uninstallModel(id) inside
      try/catch, TOLERANT (the pinned core throws 'Model not found: $id'
      on an unknown id — a failed uninstall never breaks the pass and is
      retried on the NEXT launch, never within the call; :349-359). This
      step is the ONLY one the marker skips (marker_semantics). The
      id-set comparison handles the both-assets AND any-legacy
      compositions BY CONSTRUCTION — no hardcoded filename list beyond
      what v2/v3/v4 already carry.
    - >-
      2. IDENTITY — clearActiveInferenceIdentity() (in-memory + persisted
      prefs) when leg (b) fired OR the sweep removed the active model's
      OWN file (the plugin leaves the identity pointing at a deleted file
      otherwise; :361-369). The plugin's uninstallModel does NOT clear the
      identity, so this call is what stops the in-process binding AND the
      next-launch resurrection.
    - >-
      3. THE LIE — when leg (c) fired: dao.setModelNotInstalled()
      (:371-375) — the DAO reconciles to plugin truth, and the gate's
      readiness read then honestly offers the fresh install through the
      EXISTING download flow (the gate re-offers; the normal
      progress/watchdog/timeout machinery — NO new install path; plan
      §5-P2 Ruling 3).
    - >-
      4. VERIFY + MARKER — re-list listInstalledModels(); clean = every
      remaining id's identity equals the selected filename (or the list is
      empty; :377-384). Clean → prefs.setBool('model_asset_v5', true).
      NOT clean → the marker is NOT set and there is NO retry within the
      call (one pass per invocation; the next launch retries — idempotent,
      bounded). The whole body is wrapped in the migration try/catch
      discipline — a reconciliation must never break the download gate
      (:310-392).
  marker_semantics: >-
    THE RULED DEVIATION FROM MARKER-FIRST — never marker-first (plan
    §5-P2 Ruling 2, binding): v2/v3/v4 needed marker-first because their
    triggers were broad and their bodies could trigger a download; v5's
    body NEVER downloads, and marker-first would strand a needed repair
    after a partial failure — the exact defect class that produced this
    bug (a swallowed v3 uninstall + an already-set marker leaves the
    foreign file on disk forever — the leading archaeology for the user's
    device). The marker is the VERIFIED-CLEAN record: written ONLY after
    body step 4 passes; when set, ONLY the sweep leg (a) is skipped
    (:350) — legs (b) and (c) are STATE-KEYED and run on EVERY launch
    regardless of the marker (both behaviors test-proven: with the marker
    set, a foreign active model is still repaired AND the lie is still
    detected). Recorded edge (ACCEPTED, ruled): with the marker set, a
    foreign file introduced via the AppConfig.gemmaModelUrl debug
    override lingers unless active — the override is the contract §7
    escape hatch, accepted and recorded (plan §5-P2 Ruling 2).
  the_unknown_doctrine: >-
    a pass that cannot READ the state performs NO mutation and writes NO
    marker: a null installedIds list (:321), an empty derived filename
    (:314-316), or a null re-list at verification (:382) each return the
    pass untouched. UNKNOWN is never treated as clean (no marker) and
    never as all-foreign (no sweep) — the repair never guesses.
  no_stranded_downloads: >-
    (plan §5-P2 Ruling 6) the sweep NEVER uninstalls the derived selected
    filename (the AppConfig.gemmaModelUrl override derives its own
    filename and stays legal — §1 env_override, §7
    override_caveat_amended); the both-assets composition preserves the
    Qwen file + row; the reset leg never fires when the composite probe
    disagrees.
  stop_discipline: >-
    S1 carries (plan §5-P2 Ruling 6): ONE reconciliation pass per call;
    failed uninstalls are tolerated and retried only across launches; the
    composite probe bounds the reset leg; the marker only after
    verified-clean — never an infinite fix loop. S2-P2 (pinned-source,
    binding): any divergence found against the actually-resolved
    flutter_edge_ai source → STOP, report, re-rule.
  load_seam: >-
    ensureModelActive() (plan §5-P2 Ruling 1 site 1 — as built :990-1024):
    the migrations + the v5 reconciliation run first (:991-997); then
    spec == null → return false (unchanged — the message-only sweep is the
    gate seam's job, and the gate returns before load on those devices);
    then the EARLY RETURN becomes a VERIFIED MATCH, never a blind one:
    early-return true ONLY on _activeModelIsSelected (:1032-1039) —
    hasActiveModel() AND the identity matches (per identity_comparison)
    AND the file is present. BOTH conjuncts are needed: a restored
    identity can name the right model while the file is gone (the DAO/
    plugin lie the device scout found), and the file can be present while
    a FOREIGN model is active. (Ruling refinement recorded: the ruling's
    step-4 sketch named the identity match; the as-built adds the
    file-presence conjunct, consistent with the ruling's leg-(c) lie
    semantics and "verified match, never blind" — test-proven.) Otherwise,
    when a model is active its (foreign) identity is cleared BEFORE the
    install (:1013-1015 — uninstallModel does NOT clear the identity, so
    this stops the in-process binding and the next-launch resurrection),
    and the flow FALLS THROUGH to the idempotent install chain
    (_installSelectedSpec, :1046-1063 — it skips the download when the
    file is present and ends in the plugin's setActiveModel, which
    overwrites the stale persisted identity; §2 install_shape). Returns
    hasActiveModel() (:1017). ONE repair pass per call (S1): the
    reconciliation and the install run at most once here, never in a loop.
  caller_guard_drop: >-
    (plan §5-P2 Ruling 1 site 2 — BINDING, as built) the production load
    branch's old guard `if (!FlutterEdgeAi.hasActiveModel())`
    (gemma_service.dart pre-P2 :190) is DROPPED — ensureModelActive() is
    invoked UNCONDITIONALLY in the production branch of _performLoad()
    (gemma_service.dart:180, verified 2026-11-01). This is not optional:
    with the guard in place, a restored FOREIGN active spec (exactly the
    user's device state) never reached the repair function at all.
    rehydrationFailed keeps its semantics (rehydrationFailed = !(await
    ensureModelActive()), :181) and its comment (:173-179) describes the
    verification role. Test-proven both ways: the load calls the
    verification unconditionally, and a restored foreign active spec
    REACHES the verification.
  compositions:                         # each TEST-MANDATED (plan §5-P2 Ruling 2); all four test-proven
    both_assets: >-
      a device holding BOTH assets (a legacy gemma file + the Qwen
      already downloaded) → the gemma file uninstalled, the Qwen file AND
      DAO row preserved, NO re-download (the readiness read finds Qwen;
      rehydration activates it idempotently).
    the_users_device: >-
      the user's device state (a gemma file active + the DAO row ready +
      the Qwen absent) → the gemma file uninstalled, the identity cleared,
      the row reset, and the gate offers the fresh Qwen install.
    healthy_qwen_device: >-
      a healthy Qwen device → ZERO mutations (no uninstall, no reset,
      marker-independent).
    message_only_holding_a_file: >-
      a message-only device holding ANY file → swept (every id is foreign
      when spec == null; the gate seam runs on message-only paths —
      main.dart:566-586 as-of the v1.3.0 read; the plan's pre-P2 :569-591
      anchors drifted with main.dart's growth).
  untouched: >-
    v2/v3/v4 markers and their logic stay byte-for-byte as-is (§4). The
    gate's existing path-based readiness check (model_download_service
    .dart:494-515) STAYS; the ruled leg (c) covers the storedPath == null
    blind-DB-flag branch whose trust was precisely the lie the scout found
    (the picker said ready over 530.4 MB of app data with no Qwen file —
    plan §5-P2 Ruling 3).
  tests: >-
    test/cycle44_p2_load_path_test.dart (verified present 2026-11-01): the
    identity rule, the three legs, the composite-probe lie isolation (both
    single-lying-probe negatives), the sweep tolerance, the marker
    semantics (verified-clean only; marker set + foreign-active still
    repaired; the lie still detected under the marker), the four
    compositions, the load seam (the verified match, the install-path
    identity, one repair pass, the message-only refusal), the caller-guard
    drop (unconditional; the foreign spec reaches the repair), and the
    riders (the instruction content, the chat-seam consumption, the ~1.6GB
    picker copy, the 2.6GB retirement).

# ---------------------------------------------------------------------------
# 5. RAM budget (plan §1.2 vendor measurements + §5-P1 item 5; the ≤ 6 GB
#    binding cap carries from the E2B contract §6)
# ---------------------------------------------------------------------------

ram_budget:
  binding_cap: "runtime RAM ≤ 6 GB (user directive — the E2B contract §6 binding_cap carries; plan §1.2)"
  selection_floor: >-
    totalMem >= 4 GB is the DEFAULT-OFFER floor (§3) — AMENDED at v1.2.0
    (cycle-43 §4.1, the S8 amendment): a device under the floor is never
    offered this asset BY DEFAULT; it FIRST sees the honest risk copy +
    the "Download anyway" button (§3 message_only_class, §6
    under_floor_first_use) — the warning-first discipline is the control
    — and an explicit user override AFTER the honest risk copy is
    permitted (informed consent): with the recorded ack the SAME Qwen
    spec becomes eligible (below-floor + ack ⇒ eligible, plan §4.3). The
    asset is never silently offered below the floor; any download on an
    under-floor device WITHOUT the recorded ack — or any path that skips
    the warning — is the S1 phase FAIL (cycle-43 plan §6). The RAM
    honesty is unchanged: the floor exists because the vendor peak RSS
    is ≈ 2.2 GB (vendor_figures below) — the override changes WHO
    decides, not the physics.
  measurement_source: >-
    the repo's own README — VENDOR-MEASURED on Samsung S25 Ultra,
    CPU/XNNPACK, 4 threads (plan §1.2).
  vendor_figures_q8_ekv4096:            # plan §1.2, verbatim — the INSTALLED build (§1)
    prefill_tok_s: 162.72
    decode_tok_s: 26.06
    ttft_s: 6.57
    peak_rss_mb: 2216
  vendor_figures_q8_ekv1280:            # plan §1.2 — comparative context only; NOT the installed build
    ttft_s: 3.71
    peak_rss_mb: 1997
  verdict: >-
    peak RSS ≈ 2.2 GB — the ≤ 6 GB cap holds with wide margin (plan
    §1.2); file size ≠ RAM — the mmap precedent of the E2B contract §6
    (the RAM cost is the mapped-weights working set plus anonymous
    heap/KV/activations, NOT the file size) re-confirmed by the vendor's
    own peak-RSS column (plan §1.2).
  backend_ruling: >-
    CPU (§2 load_shape) — the CPU figures above are what the cap ruling
    rests on (plan §1.2; the E2B contract §6 backend_ruling discipline).
  caveat_32bit: >-
    recorded HONESTLY (plan §5-P1 item 5): a ~2.2 GB peak RSS on an
    armeabi-v7a process is at the edge of the 32-bit address space. The
    designed answer is NEVER a silent failure: the load-failure class (the
    cycle-40 failure classes, §7) plus ladder rung (b) (Qwen 0.5B — the
    under-floor degradation rung, §1 fallback_ladder) are the designed
    answers (plan §5-P1 item 5). Refinement path: Reviewer search 4 (plan
    §10) checks MediaPipe's 32-bit posture; the user's device facts (F10)
    may refine the floor or this caveat — a fact REFINES, never blocks
    (plan §6 refinement clause); a contradicting fact re-opens the PLAN,
    not the phase.

