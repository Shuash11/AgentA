selection_table:
  amendment_record: >-
    COLLAPSED by the Adviser's lived-evidence amendment (plan §4.9,
    2026-10-31; §11 governance row): the user directive (VERBATIM) "make
    the qwen the main model offline" — with the lived evidence: v1.8.2 on
    the user's arm64 phone routed them to the E2B .litertlm asset and the
    LiteRT-LM engine failed to load (download complete → load failed; the
    full two-input record with the verbatim diagnostic quotes is plan
    §4.9 + §11). Cycle-38's S4 condition FIRED on lived evidence; the F7
    pre-authorization to the Qwen .task row is INVOKED. The v1.0.0
    two-class table (arm64_primary / fallback_class) is COLLAPSED to one
    selection class — the simplest table satisfying the tests' intent;
    two classes with identical specs would be pure churn (plan §4.9).
  shape: >-
    ONE SELECTION CLASS, AUTOMATIC, RUNTIME SELF-REPORTING: the model spec
    resolves ONCE per device from the EXISTING DeviceCapabilities seam
    (lib/services/ai/device_capabilities.dart — the cached-verdict pattern,
    verified 2026-10-31; plan §1.6). NO user input decides WHICH model —
    each device self-reports totalMem at runtime, and the ONE user input
    added at v1.2.0 is the under-floor CONSENT gate (§ under_floor_override:
    the recorded ack admits the SAME spec below the floor — it never
    selects a different model; plan §4.3). NO dependency on receiving
    device specs. P2's implemented machinery (spec table, totalMem read,
    v4, spec-driven chains/identity/UI) is exactly what this single-spec
    ruling needs — the amendment is the cheap reshaping of an
    already-built surface (plan §4.9, §5-P2b).
  keys: >-
    ONE capability key: totalMem (the P2-implemented read —
    ActivityManager.MemoryInfo.totalMem beside supportedAbis in
    MainActivity.kt, via the com.agenta.agenta/device MethodChannel; the
    @visibleForTesting seams per device_capabilities.dart's established
    pattern, as recorded at v1.0.0) — JOINED at v1.2.0 by ONE
    user-consent input: the persisted override ack (§ under_floor_override;
    the flag + the verdict are read at the SAME DeviceCapabilities seam —
    plan §4.2). The eligibility VERDICT becomes: totalMem >= 4 GB OR the
    recorded override ack (the plan's verbatim formula, plan §4.3 +
    §5-P2 item 1; below-floor + ack ⇒ eligible — the SAME Qwen spec; the
    UNREADABLE-totalMem edge is recorded explicitly in
    under_floor_override, not silently resolved). ABI IS NO LONGER
    CONSULTED FOR SELECTION (plan §4.9): the MediaPipe .task engine is
    the multi-ABI engine (cycle-40 §1.1), so the ABI verdict is
    irrelevant to which model a device is offered. The verdict machinery
    STAYS in code — see unsupportedAbi_mapping_note below.
  classes:                              # the table — binding, plan §4.9
    single_qwen_class: >-
      EVERY device (any ABI) with totalMem >= 4 GB → Qwen 2.5 1.5B Instruct
      .task — THIS contract (§1/§2): identity qwen2.5-1.5b-it, install
      URL/size/sha per §1, engine per §2. The 'Model size: ~1.6GB' chip is
      UNIVERSAL on this class (the §6 gate_size_chip e2b_class row is
      superseded — no E2B class exists in selection anymore). An
      under-floor device holding the recorded override ack joins THIS
      class — the SAME spec, nothing re-specified (§ under_floor_override;
      below-floor + ack ⇒ eligible, plan §4.3).
    message_only_class: >-
      totalMem < 4 GB OR totalMem UNREADABLE (the fail-closed KEPT, S8
      carries — a device that cannot report RAM gets the message-only
      honesty, plan §4.9). AMENDED at v1.2.0 (cycle-43 §4.1-§4.3) — the
      BELOW-FLOOR disjunct becomes the WARNING-FIRST override state: NO
      model is offered by default; the honest message STAYS (its wording
      GENERALIZED to the RAM reason, NO ABI mention —
      DeviceCapabilities.incompatibleDeviceMessage,
      device_capabilities.dart:33-34 as-of the v1.2.0 recording,
      2026-11-01 — re-verify at P2 per the header anchor policy) and the
      ruled risk copy renders FIRST (§6 under_floor_first_use) with the
      "Download anyway" button; an explicit tap records the ack and
      proceeds to the download flow (plan §5-P2 item 2). After the ack,
      subsequent visits show the download ENABLED with the SHORT retained
      risk line (§6 under_floor_post_ack) — never re-nagged, never
      silently green. The PRE-ACK state has NO auto-enabled download
      (cycle-43 §6 S1 — a download without the recorded ack is the phase
      FAIL); NO retry is added anywhere (the override is CONSENT, not a
      retry — cycle-40's no-retry discipline carries; failures classify
      per §7). The UNREADABLE disjunct: see under_floor_override's
      unreadable_edge note (recorded, not silently resolved). The
      IDENTITY on this row is 'qwen2.5-1.5b-it' APP-WIDE — the identity
      is the app's offline-model NAME, not the installed asset (the row
      never installs BY DEFAULT; with the recorded ack the below-floor
      disjunct installs the SAME spec — § under_floor_override)
      (plan §4.9).
    under_floor_override: >-
      NEW at v1.2.0 (cycle-43 §4.1-§4.3 — the binding record of the
      override state). WHAT: the message-only state's below-floor
      disjunct gains an explicit, consent-gated path to the SAME Qwen
      spec (§ single_qwen_class — identity qwen2.5-1.5b-it, install
      URL/size/sha per §1, engine per §2 — NOT a different model, plan
      §4.3). VERDICT: totalMem >= 4 GB OR the recorded override ack
      (below-floor + ack ⇒ eligible); the flag + the verdict are read at
      the existing DeviceCapabilities seam (plan §4.2). FLAG:
      SharedPreferencesAsync, key "offline_ram_override_ack" (the
      modern-API precedent — online_ai_service.dart:94/:125,
      update_cubit.dart:189/:279-283, the cycle-29 P1 precedent; verified
      2026-11-01); a setter + the @visibleForTesting seam per
      device_capabilities.dart's established pattern (plan §5-P2 item 1);
      a user PREFERENCE, NOT a migration marker (§4 is untouched — no
      DAO/model_asset-marker implications, plan §4.3); NEVER auto-cleared
      (the warning served its purpose; the failure path is the honest
      backstop, plan §4.1). DISCIPLINE — S8 AMENDED (warning-first,
      cycle-43 §6 S1): the asset is never OFFERED BY DEFAULT below the
      floor; the honest risk copy renders FIRST (§6
      under_floor_first_use), and only an explicit user override AFTER it
      is permitted (informed consent — the warning-first discipline is
      the control); after the ack the user is never re-nagged and the
      honesty never disappears (the short line stays — §6
      under_floor_post_ack). SURFACES — all FOUR, consistently (plan
      §4.2): the gate (lib/main.dart:807 as-of the v1.2.0 recording,
      2026-11-01), the download screen
      (lib/presentation/ai/download_prompt_screen.dart:216), the chat
      card (lib/presentation/chats/chats.dart:686/:780) and the picker
      tile (lib/presentation/chats/widgets/model_picker_sheet.dart:20)
      each render the risk copy + the "Download anyway" button in the
      message-only state; the card/picker buttons SET the ack and ROUTE
      into the download screen with the override acknowledged (one flow,
      four entries — the established multi-surface pattern); re-verify
      the anchors at P2 per the header anchor policy. FAILURE PATH —
      untouched: an OOM/kill on an overridden device classifies and
      surfaces exactly as today (§7; plan §4.4 — the cycle-40
      failure-class layer is the safety net). NEXT RUNG — the 0.5B
      degradation rung stays the recorded FAST-FOLLOW (§1 fallback_ladder
      rung (b); trigger: the user reports the 1.5B killed/unloadable on
      3.64 GB; plan §4.5) — OUT OF SCOPE this cycle (cycle-43 §6 S2,
      grep-gated; never an offered tier). EMPIRICAL TEST — ship and let
      the user test on their own phone; the agent-side load test is
      REJECTED (plan §4.4); the risk copy's "may" is the honesty
      contract — genuinely unknown until their test. UNREADABLE EDGE —
      recorded, not silently resolved: plan §4.3's headline names
      "below-floor + ack ⇒ eligible", while its ruled formula
      ("totalMem >= floor OR ack", plan §5-P2 item 1) read literally also
      admits an UNREADABLE-totalMem device whose ack is recorded (at the
      resolver seam — offline_model_spec.dart:216-222/:248-266 as-of the
      v1.3.0 read, 2026-11-01; the v1.2.0-recorded :141-144/:168-169
      drifted when the cycle-44 rider A inserted the systemInstruction
      field above them — the seam's SEMANTICS are unchanged: both
      below-floor and unreadable arrive as 'floor not cleared'). The
      ruled test matrix (plan §5-P2 item 3) covers
      below-floor ± ack and above-floor ONLY — no unreadable case; the
      fail-closed primitive (DeviceCapabilities.clearsMemoryFloor's
      null→false, device_capabilities.dart:207-210, verified 2026-11-01)
      is NOT this ruling's subject. P2 implements the RULED FORMULA; the
      unreadable disposition is flagged to the Adviser for confirmation
      at P2 review (reported, not silently resolved).
  floor_rationale: >-
    the 4 GB totalMem floor exists because the vendor peak RSS for this
    asset is ≈ 2.2 GB (§5) — a device under 4 GB total RAM cannot hold the
    runtime with margin (plan §4.3/§4.9, §5-P1 item 5); the floor keeps
    the ONE offer RAM-honest (the 2.2 GB peak-RSS honesty, plan §4.9).
    The v1.2.0 override does NOT repeal the physics: it converts the
    floor from a refusal into informed consent — the risk copy states the
    SAME honesty and the user decides (§ under_floor_override, §5
    selection_floor; plan §4.1).
  one_active_model: >-
    the plugin holds ONE active model — satisfied by construction: each
    device resolves exactly ONE spec from this table and installs exactly
    that model (plan §4.3/§4.9).
  unsupportedAbi_mapping_note: >-
    the unsupportedAbi failure-class mapping STAYS IN CODE
    (gemma_service.dart:314/:367 as-of the v1.0.0 recording) —
    rarely-reachable, zero-risk; less churn than removal (plan §4.9). It
    is a failure-class mapping only — NOT a selection input (§ keys).
  s4_invoked: >-
    the armed cycle-38 S4 ladder (arm64-primary + PERSISTENT E2B load
    failure on the fixed build) has FIRED on lived evidence — the user's
    v1.8.2 arm64 phone, download complete → load failed, user report
    2026-10-31 (plan §4.9); the F7 pre-authorization to THIS contract's
    Qwen .task spec is INVOKED — no separate re-ruling was needed for the
    Qwen asset (plan §2 F7, §4.9). With the table now single-class, the
    Qwen spec IS the selection; this field records the invocation (the
    pre-authorization mechanism is spent).
  stranded_e2b_rule_amended: >-
    SUPERSEDED (the v1.0.0 keep-rule — "a device IN A SUPPORTED CLASS that
    downloaded E2B pre-gate KEEPS it" — is DELETED): every device holding
    the E2B asset is now INELIGIBLE for it — selection no longer offers
    E2B on any device — so migration v4 (§4, WIDENED) fires for ANY
    stranded E2B asset and uninstalls it (plan §4.9). No device keeps
    E2B anymore.
  e2b_exit_pointer: >-
    E2B EXITS SELECTION ENTIRELY (plan §4.9): the exit record — the
    S4-fired lived evidence, the widened-v4 cross-reference and the future
    opt-in status — is contracts/offline-model-e2b.yaml v1.3.0 §11
    (selection_exit_record; the v1.2.0 §10 arm64-primary-class pointer is
    superseded there). The E2B ASSET stays at source — P3's Shard B
    re-verifies it unchanged even though unselected (plan §5-P3 Shard B).
    Future opt-in under the plugin's one-active-model constraint is the
    cycle-38 F8 lineage (plan §2 F8) — backlog, future cycle.
  consumers: >-
    the resolved spec feeds: both install chains (§2 install_shape), the
    identity sites (§2 identity_sites), the gate/download/card/picker
    states (§6), and the migration trigger (§4) — now from the SINGLE
    class. Consumer sites as recorded at v1.0.0 (verified 2026-10-31:
    main.dart:551 the gate, download_prompt_screen.dart:101 the screen,
    chats.dart:645 the card, model_picker_sheet.dart:36 the picker) —
    re-verify at P2b per the header anchor policy. At v1.2.0 the CURRENT
    consumer is cycle-43's P2 (the override wiring — §
    under_floor_override); the message-only render sites were re-verified
    2026-11-01 at main.dart:807, download_prompt_screen.dart:216,
    chats.dart:686/:780, model_picker_sheet.dart:20.
  supersedes: >-
    the per-class phrasing recorded at v1.0.0 elsewhere in this file is
    SUPERSEDED by THIS table (kept in place as the P2-era record; those
    sections' figures, shapes, anchors and strings are otherwise
    UNCHANGED): §2 identity_invariant's "'qwen2.5-1.5b-it' on the fallback
    class, 'gemma-4-e2b-it' on the E2B class" → the identity is
    'qwen2.5-1.5b-it' APP-WIDE, message-only row included; §6
    gate_size_chip's e2b_class row ('~2.6GB') → the '~1.6GB' chip is
    UNIVERSAL (no E2B class in selection); §6 picker_chat_card_states'
    arm64_primary/fallback_class enumeration → the SINGLE class's
    affordances (its own "per the §3 table" deference inherits this
    amendment); §7 failure_classes'
    "non-arm64-ineligible / < 4 GB case" reason → the RAM-only wording
    (§ message_only_class); §8 p2_selection_tests/p2_identity_invariant's
    per-class framing → single-class per plan §5-P2b items 1/3/5. This
    amendment touches §3/§4 and the header record ONLY (plan §4.9's
    contract path).
  supersedes_v1_2_0: >-
    the cycle-43 override ruling (plan §4.1-§4.3) supersedes, with the
    amended text edited IN PLACE where it is load-bearing and recorded
    here for the audit trail: §5 selection_floor's "a device under the
    floor is NEVER offered this asset" → the AMENDED S8 wording (never
    offered BY DEFAULT; the explicit post-warning override admits the
    SAME spec — see under_floor_override and the amended §5
    selection_floor); §7 stop_divergences' "S8 (the Qwen asset offered on
    a device failing §3)" → the AMENDED S8/S1 stop (offered by default
    below the floor, OR any download without the recorded ack, OR any
    skipped warning = phase FAIL — see the amended §7 stop_divergences);
    §8 p2_selection_tests' "non-arm64 < 4 GB → ineligible" framing →
    below-floor + ack ⇒ eligible per THIS table (the no-ack below-floor
    case stays ineligible — S1); §6 picker_chat_card_states'
    message_only_class row's "NO CTA" → the below-floor state gains the
    ruled override affordances (§6 under_floor_first_use /
    under_floor_post_ack) while NO retry STAYS (§6, amended in place).
    Superseded NOWHERE: the unreadable fail-closed disposition question
    is recorded in under_floor_override (not silently resolved); the
    above-floor flow is unchanged (plan §5-P2 criterion 3); §1/§2/§4 are
    untouched by this amendment.

# ---------------------------------------------------------------------------
# 4. Migration contract v4 (plan §4.4 as WIDENED by §4.9 — BINDING;
#    §5-P2b item 2; the no-stranded-downloads rule with the v3 self-reset
#    lesson GENERALIZED to the asset-presence trigger)
# ---------------------------------------------------------------------------

migration_v4:
  owner: >-
    lib/services/ai/model_download_service.dart — a v4 migration alongside
    the untouched v2 (_migrateStaleAssetIfPresent, :529-551) and v3
    (_migrateLegacyAssetIfPresent, :552-622) logic (verified 2026-10-31;
    the v1.0.0 anchors :227/:232/:251/:253 drifted with the service's
    growth, re-verified 2026-11-01; plan §4.4, §5-P2 item 4). v1.3.0 NOTE:
    v2/v3/v4 markers and logic remain BYTE-FOR-BYTE UNTOUCHED by cycle-44
    (plan §5-P2 Ruling 2) — only line positions moved; the v5 sibling is
    §4b below.
  marker: "model_asset_v4"              # new SharedPreferences bool — plan §4.4
  call_site: >-
    the SAME gate seam as v3 — checkModelExists(), invoked BEFORE the
    readiness read (the v3 §4.8 call-site ruling carried; plan §4.4) — so
    the DAO reset lands before the status decision on the very launch it
    fires, on EVERY launch path (the E2B contract §3 call_site enumerates
    the seam's reach).
  trigger: >-
    WIDENED (plan §4.9 — the v1.0.0 capability-verdict clause "AND the
    device fails the E2B-eligibility verdict" is DELETED; the verdict is
    universal): marker absent AND the E2B ASSET ITSELF is present —
    FlutterEdgeAi.activeModelSpec?.name == 'gemma-4-E2B-it.litertlm' OR
    FlutterEdgeAi.isModelInstalled('gemma-4-E2B-it.litertlm') (the v3 §4.8
    probe semantics carried — the persisted-name rationale, E2B contract
    §3 trigger). Every device holding the E2B asset is now ineligible for
    it (§3: E2B left selection), so ANY stranded E2B asset fires v4 —
    including an arm64 device that downloaded E2B on v1.8.2 (the
    S4-fired lived-evidence population, §3 s4_invoked). The v3 self-reset
    lesson GENERALIZED and BINDING (plan §4.9): the trigger keys on the
    E2B ASSET's presence, NEVER on a generic has-model condition — a
    Qwen-asset user must NEVER fire v4 (no E2B asset → both probe legs
    false → no trigger; the never-fire proof is a P2b test, plan §5-P2b
    criterion 2); the S7 loop/strand hazards carry (plans/cycle-42 §6).
  steps:                                # ORDER IS NORMATIVE — plan §4.4/§4.9
    - "1. set marker model_asset_v4 = true FIRST (a crash can never loop the download — the v2/v3 marker-first pattern, E2B contract §3 steps)"
    - "2. FlutterEdgeAi.uninstallModel('gemma-4-E2B-it.litertlm') inside try/catch, tolerant of already-unregistered / file-missing — safe to continue (plan §4.4)"
    - "3. dao.setModelNotInstalled() — resets the DB row (the row's identity becomes the SELECTED spec's identity per §2 identity_sites — universally 'qwen2.5-1.5b-it')"
    - "4. the gate re-offers per the §3 selection table — UNIVERSALLY the Qwen flow (the ~1.6GB chip) on a >= 4 GB device, or the message-only class; no user-facing migration UI"
  both_assets_composition: >-
    TEST-REQUIRED (plan §4.9, §5-P2b item 2 + criterion 2): a device
    holding BOTH assets (E2B stranded + Qwen already downloaded) fires v4
    ONCE — the marker is absent and the E2B asset is present (the trigger
    does not require Qwen's absence) — cleans E2B (tolerant uninstall +
    DAO reset), and the gate's readiness read FINDS QWEN: no Qwen
    re-download is forced.
  uninstall_id: >-
    'gemma-4-E2B-it.litertlm' — the E2B asset's filename (the E2B contract
    §1 file, exact case; plan §4.4). VERIFY-AT-P2 NOTE (plan §5-P1 item 4):
    verify the exact id at P2 against the pinned core's persisted-name
    semantics (the cycle-38 §4.8 probe precedent — activeModelSpec.name is
    the persisted filename on restore); a case-mismatched probe is a
    silent no-migration.
  untouched: >-
    v2 AND v3 markers and their logic stay exactly as-is (plan §4.4; the
    E2B contract §3 untouched). SUPERSEDED (deleted from v1.0.0): "a
    supported-class device that downloaded E2B pre-gate keeps it" — under
    the widened trigger NO device keeps E2B (§3
    stranded_e2b_rule_amended); v2/v3's own target populations and logic
    are unaffected.
  why_needed: >-
    two waves (plan §4.4 + §4.9): (1) devices that downloaded the 2.59 GB
    .litertlm BEFORE the v1.8.1 ABI gate (the install path never checked
    ABI then — cycle-40 §1.2) hold a file they can NEVER load: wasted
    2.59 GB + a dead asset (F2, plan §2); (2) the lived evidence (§3
    s4_invoked) proves the E2B engine fails on real arm64 devices too —
    with selection collapsed to the Qwen spec, EVERY E2B asset in the
    wild is stranded. v4 moves the dead asset out and the gate offers the
    working Qwen class.

