# ---------------------------------------------------------------------------
# 3. Selection table (plan §4.3 as AMENDED by §4.9, then by cycle-43
#    §4.1-§4.3 — BINDING; the lived-evidence directive collapsed the
#    two-key matrix to ONE class; cycle-43 adds the under-floor
