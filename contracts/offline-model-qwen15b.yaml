selection_table:
  amendment_record: >-
    COLLAPSED by the Adviser's lived-evidence amendment (plan §4.9,
    2026-10-31; §11 governance row): the user directive (VERBATIM) "make
    the qwen the main model offline" — with the lived evidence: v1.8.2 on
    the user's arm64 phone routed them to the E2B .litertlm asset and the
    LiteRT-LM engine failed to load (download complete → load failed; the
    full two-input record with the verbatim diagnostic quotes is plan
    §4.9 + §11). Cycle-38's S4 condition FIRED on lived evidence; the F7
    pre-authorization to the Qwen .task row is INVOKED. The v1.0.0
    two-class table (arm64_primary / fallback_class) is COLLAPSED to one
    selection class — the simplest table satisfying the tests' intent;
    two classes with identical specs would be pure churn (plan §4.9).
  shape: >-
    ONE SELECTION CLASS, AUTOMATIC, RUNTIME SELF-REPORTING: the model spec
    resolves ONCE per device from the EXISTING DeviceCapabilities seam
    (lib/services/ai/device_capabilities.dart — the cached-verdict pattern,
    verified 2026-10-31; plan §1.6). NO user input; NO dependency on
    receiving device specs — each device self-reports totalMem at runtime.
    P2's implemented machinery (spec table, totalMem read, v4, spec-driven
    chains/identity/UI) is exactly what this single-spec ruling needs —
    the amendment is the cheap reshaping of an already-built surface
    (plan §4.9, §5-P2b).
  keys: >-
    ONE selection key: totalMem (the P2-implemented read —
    ActivityManager.MemoryInfo.totalMem beside supportedAbis in
    MainActivity.kt, via the com.agenta.agenta/device MethodChannel; the
    @visibleForTesting seams per device_capabilities.dart's established
    pattern, as recorded at v1.0.0). ABI IS NO LONGER CONSULTED FOR
    SELECTION (plan §4.9): the MediaPipe .task engine is the multi-ABI
    engine (cycle-40 §1.1), so the ABI verdict is irrelevant to which
    model a device is offered. The verdict machinery STAYS in code — see
    unsupportedAbi_mapping_note below.
  classes:                              # the table — binding, plan §4.9
    single_qwen_class: >-
      EVERY device (any ABI) with totalMem >= 4 GB → Qwen 2.5 1.5B Instruct
      .task — THIS contract (§1/§2): identity qwen2.5-1.5b-it, install
      URL/size/sha per §1, engine per §2. The 'Model size: ~1.6GB' chip is
      UNIVERSAL on this class (the §6 gate_size_chip e2b_class row is
      superseded — no E2B class exists in selection anymore).
    message_only_class: >-
      totalMem < 4 GB OR totalMem UNREADABLE (the fail-closed KEPT, S8
      carries — a device that cannot report RAM gets the message-only
      honesty, plan §4.9) → NO model — the honest message, its wording
      GENERALIZED to the RAM reason (NO ABI mention): NO download CTA,
      NO retry (cycle-40's discipline; P2b acceptance criterion 5; the
      message constant DeviceCapabilities.incompatibleDeviceMessage,
      device_capabilities.dart:28 as-of the v1.0.0 recording — re-verify
      the site at P2b per the header anchor policy). The IDENTITY on this
      row is 'qwen2.5-1.5b-it' APP-WIDE — the identity is the app's
      offline-model NAME, not the installed asset (the row never installs)
      (plan §4.9).
  floor_rationale: >-
    the 4 GB totalMem floor exists because the vendor peak RSS for this
    asset is ≈ 2.2 GB (§5) — a device under 4 GB total RAM cannot hold the
    runtime with margin (plan §4.3/§4.9, §5-P1 item 5); the floor keeps
    the ONE offer RAM-honest (the 2.2 GB peak-RSS honesty, plan §4.9).
  one_active_model: >-
    the plugin holds ONE active model — satisfied by construction: each
    device resolves exactly ONE spec from this table and installs exactly
    that model (plan §4.3/§4.9).
  unsupportedAbi_mapping_note: >-
    the unsupportedAbi failure-class mapping STAYS IN CODE
    (gemma_service.dart:314/:367 as-of the v1.0.0 recording) —
    rarely-reachable, zero-risk; less churn than removal (plan §4.9). It
    is a failure-class mapping only — NOT a selection input (§ keys).
  s4_invoked: >-
    the armed cycle-38 S4 ladder (arm64-primary + PERSISTENT E2B load
    failure on the fixed build) has FIRED on lived evidence — the user's
    v1.8.2 arm64 phone, download complete → load failed, user report
    2026-10-31 (plan §4.9); the F7 pre-authorization to THIS contract's
    Qwen .task spec is INVOKED — no separate re-ruling was needed for the
    Qwen asset (plan §2 F7, §4.9). With the table now single-class, the
    Qwen spec IS the selection; this field records the invocation (the
    pre-authorization mechanism is spent).
  stranded_e2b_rule_amended: >-
    SUPERSEDED (the v1.0.0 keep-rule — "a device IN A SUPPORTED CLASS that
    downloaded E2B pre-gate KEEPS it" — is DELETED): every device holding
    the E2B asset is now INELIGIBLE for it — selection no longer offers
    E2B on any device — so migration v4 (§4, WIDENED) fires for ANY
    stranded E2B asset and uninstalls it (plan §4.9). No device keeps
    E2B anymore.
  e2b_exit_pointer: >-
    E2B EXITS SELECTION ENTIRELY (plan §4.9): the exit record — the
    S4-fired lived evidence, the widened-v4 cross-reference and the future
    opt-in status — is contracts/offline-model-e2b.yaml v1.3.0 §11
