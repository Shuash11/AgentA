# 5. RAM budget (plan §1.2 vendor measurements + §5-P1 item 5; the ≤ 6 GB
#    binding cap carries from the E2B contract §6)
# ---------------------------------------------------------------------------

ram_budget:
  binding_cap: "runtime RAM ≤ 6 GB (user directive — the E2B contract §6 binding_cap carries; plan §1.2)"
  selection_floor: >-
    totalMem >= 4 GB is the OFFER floor (§3): a device under the floor is
    NEVER offered this asset (plan §4.3; the S8 honesty discipline —
    plan §6).
  measurement_source: >-
    the repo's own README — VENDOR-MEASURED on Samsung S25 Ultra,
    CPU/XNNPACK, 4 threads (plan §1.2).
  vendor_figures_q8_ekv4096:            # plan §1.2, verbatim — the INSTALLED build (§1)
    prefill_tok_s: 162.72
    decode_tok_s: 26.06
    ttft_s: 6.57
    peak_rss_mb: 2216
  vendor_figures_q8_ekv1280:            # plan §1.2 — comparative context only; NOT the installed build
    ttft_s: 3.71
    peak_rss_mb: 1997
  verdict: >-
    peak RSS ≈ 2.2 GB — the ≤ 6 GB cap holds with wide margin (plan
    §1.2); file size ≠ RAM — the mmap precedent of the E2B contract §6
    (the RAM cost is the mapped-weights working set plus anonymous
    heap/KV/activations, NOT the file size) re-confirmed by the vendor's
    own peak-RSS column (plan §1.2).
  backend_ruling: >-
    CPU (§2 load_shape) — the CPU figures above are what the cap ruling
    rests on (plan §1.2; the E2B contract §6 backend_ruling discipline).
  caveat_32bit: >-
    recorded HONESTLY (plan §5-P1 item 5): a ~2.2 GB peak RSS on an
    armeabi-v7a process is at the edge of the 32-bit address space. The
    designed answer is NEVER a silent failure: the load-failure class (the
    cycle-40 failure classes, §7) plus ladder rung (b) (Qwen 0.5B — the
    under-floor degradation rung, §1 fallback_ladder) are the designed
    answers (plan §5-P1 item 5). Refinement path: Reviewer search 4 (plan
    §10) checks MediaPipe's 32-bit posture; the user's device facts (F10)
    may refine the floor or this caveat — a fact REFINES, never blocks
    (plan §6 refinement clause); a contradicting fact re-opens the PLAN,
    not the phase.

