migration_v4:
  owner: >-
    lib/services/ai/model_download_service.dart — a v4 migration alongside
    the untouched v2 (:227/:232) and v3 (:251/:253) logic (verified
    2026-10-31; plan §4.4, §5-P2 item 4).
  marker: "model_asset_v4"              # new SharedPreferences bool — plan §4.4
  call_site: >-
    the SAME gate seam as v3 — checkModelExists(), invoked BEFORE the
    readiness read (the v3 §4.8 call-site ruling carried; plan §4.4) — so
    the DAO reset lands before the status decision on the very launch it
    fires, on EVERY launch path (the E2B contract §3 call_site enumerates
    the seam's reach).
  trigger: >-
    WIDENED (plan §4.9 — the v1.0.0 capability-verdict clause "AND the
    device fails the E2B-eligibility verdict" is DELETED; the verdict is
    universal): marker absent AND the E2B ASSET ITSELF is present —
    FlutterEdgeAi.activeModelSpec?.name == 'gemma-4-E2B-it.litertlm' OR
    FlutterEdgeAi.isModelInstalled('gemma-4-E2B-it.litertlm') (the v3 §4.8
    probe semantics carried — the persisted-name rationale, E2B contract
    §3 trigger). Every device holding the E2B asset is now ineligible for
    it (§3: E2B left selection), so ANY stranded E2B asset fires v4 —
    including an arm64 device that downloaded E2B on v1.8.2 (the
    S4-fired lived-evidence population, §3 s4_invoked). The v3 self-reset
    lesson GENERALIZED and BINDING (plan §4.9): the trigger keys on the
    E2B ASSET's presence, NEVER on a generic has-model condition — a
    Qwen-asset user must NEVER fire v4 (no E2B asset → both probe legs
    false → no trigger; the never-fire proof is a P2b test, plan §5-P2b
    criterion 2); the S7 loop/strand hazards carry (plans/cycle-42 §6).
  steps:                                # ORDER IS NORMATIVE — plan §4.4/§4.9
    - "1. set marker model_asset_v4 = true FIRST (a crash can never loop the download — the v2/v3 marker-first pattern, E2B contract §3 steps)"
    - "2. FlutterEdgeAi.uninstallModel('gemma-4-E2B-it.litertlm') inside try/catch, tolerant of already-unregistered / file-missing — safe to continue (plan §4.4)"
    - "3. dao.setModelNotInstalled() — resets the DB row (the row's identity becomes the SELECTED spec's identity per §2 identity_sites — universally 'qwen2.5-1.5b-it')"
    - "4. the gate re-offers per the §3 selection table — UNIVERSALLY the Qwen flow (the ~1.6GB chip) on a >= 4 GB device, or the message-only class; no user-facing migration UI"
  both_assets_composition: >-
    TEST-REQUIRED (plan §4.9, §5-P2b item 2 + criterion 2): a device
    holding BOTH assets (E2B stranded + Qwen already downloaded) fires v4
    ONCE — the marker is absent and the E2B asset is present (the trigger
    does not require Qwen's absence) — cleans E2B (tolerant uninstall +
    DAO reset), and the gate's readiness read FINDS QWEN: no Qwen
    re-download is forced.
  uninstall_id: >-
    'gemma-4-E2B-it.litertlm' — the E2B asset's filename (the E2B contract
    §1 file, exact case; plan §4.4). VERIFY-AT-P2 NOTE (plan §5-P1 item 4):
    verify the exact id at P2 against the pinned core's persisted-name
    semantics (the cycle-38 §4.8 probe precedent — activeModelSpec.name is
    the persisted filename on restore); a case-mismatched probe is a
    silent no-migration.
  untouched: >-
    v2 AND v3 markers and their logic stay exactly as-is (plan §4.4; the
    E2B contract §3 untouched). SUPERSEDED (deleted from v1.0.0): "a
    supported-class device that downloaded E2B pre-gate keeps it" — under
    the widened trigger NO device keeps E2B (§3
    stranded_e2b_rule_amended); v2/v3's own target populations and logic
    are unaffected.
  why_needed: >-
    two waves (plan §4.4 + §4.9): (1) devices that downloaded the 2.59 GB
    .litertlm BEFORE the v1.8.1 ABI gate (the install path never checked
    ABI then — cycle-40 §1.2) hold a file they can NEVER load: wasted
    2.59 GB + a dead asset (F2, plan §2); (2) the lived evidence (§3
    s4_invoked) proves the E2B engine fails on real arm64 devices too —
    with selection collapsed to the Qwen spec, EVERY E2B asset in the
    wild is stranded. v4 moves the dead asset out and the gate offers the
    working Qwen class.

