  identity_string: qwen2.5-1.5b-it      # plan §4.1/§4.3
  identity_sites:                       # the four-site invariant of the E2B contract §2 — SPEC-DRIVEN AS BUILT (plan §5-P1 item 2; re-verified 2026-11-01 post-P2 — the v1.0.0 "currently hardcoded" framing and anchors are superseded; the `_modelType` symbol is GONE)
    - lib/services/ai/model_download_service.dart:773 and :794
