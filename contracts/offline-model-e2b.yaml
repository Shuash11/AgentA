# ---------------------------------------------------------------------------
# 2. Engine contract (plan §1.3 + §5-P1 item 2; code sites re-verified)
# ---------------------------------------------------------------------------

engine_contract:
  dependency:
    package: flutter_edge_ai_litertlm
    pin: "1.8.6"                       # EXACT pin — no caret, no range (plan §4.2)
    pubspec_site: >-
      pubspec.yaml dependencies block, beside the untouched pins
      flutter_edge_ai: ^1.11.4 (:21) and flutter_edge_ai_mediapipe: ^1.0.8 (:22)
    required_comment: >-
      one line: "1.8.6 = the only litertlm release compatible with core
      ^1.11.4; see plans/cycle-38 §1.3" (plan §5-P2 item 1)
    pairing_evidence: >-
      pub.dev API 2026-10-29 (plan §1.3): 1.8.6 (published 2026-10-03)
      requires exactly flutter_edge_ai ^1.11.4 — the app's pinned core; every
      later release (1.8.7 → 1.19.0) demands core ^2.x; environment
      flutter >=3.44.0, satisfied (app on Flutter 3.47.6, cycle-36 P7 record).
    untouched_pins: >-
      flutter_edge_ai ^1.11.4 and flutter_edge_ai_mediapipe ^1.0.8 stay as-is;
      flutter pub get must leave pubspec.lock's flutter_edge_ai 1.11.4 +
      flutter_edge_ai_mediapipe 1.0.8 unchanged (plan §5-P2 criterion 8;
      divergence = STOP S1, §7).
    native_libs: >-
      fetched at build time via Native Assets (SHA256-verified) — no manual
      native setup (plan §1.3, plugin docs); CI proof is the P5 Build run
      (STOP S3 lives in plan §6).
  engine_registration:
    site: >-
      lib/main.dart:174-177 (FlutterEdgeAi.initialize) — keep the existing
      try/catch-ignore (:178-182) and maxDownloadRetries: 3 unchanged
    before: "inferenceEngines: const [MediaPipeEngine()]"
    after: "inferenceEngines: const [MediaPipeEngine(), LiteRtLmEngine()]"
    import: LiteRtLmEngine from package:flutter_edge_ai_litertlm
    coexistence: >-
      MediaPipeEngine stays registered — the §3 migration uninstall id
      'gemma3-1b-it-int4.task' still resolves through it (plan §4.2).
  install_shape:
    gate_chain: >-
      lib/services/ai/model_download_service.dart:266-276 —
      FlutterEdgeAi.installModel(modelType: ModelType.gemma4,
      fileType: ModelFileType.litertlm).fromNetwork(resolvedModelUrl,
      token: AppConfig.hfToken.trim(),
      foreground: AppConfig.foregroundDownload)
      .withProgress(_onDownloadProgress).withCancelToken(token).install()
      — ONLY modelType/fileType change; token/foreground/progress/cancel
      wiring unchanged.
    loadtime_chain: >-
      lib/services/ai/model_download_service.dart:494-500 (ensureModelActive)
      — same modelType/fileType/fromNetwork args; no progress/cancel wiring
      (unchanged shape), inline timeout per §4.
    model_type: ModelType.gemma4        # exists in pinned core (plan §1.3, pub-cache source model.dart)
    file_type: ModelFileType.litertlm   # selects the ENGINE — never inferred from a filename (core README, plan §1.3)
    token: AppConfig.hfToken.trim()     # kept per §1 token_threading; no new secret surface
  load_shape:
    get_active_model: >-
      FlutterEdgeAi.getActiveModel(maxTokens: 2048, preferredBackend:
      PreferredBackend.cpu) — gemma_service.dart:99-102 (_maxTokens = 2048 at
      :20); parameters UNCHANGED.
    create_chat: >-
      gemma_service.dart:104-110 — temperature 0.3, randomSeed 1, topK 30,
      topP 0.85, systemInstruction (_systemInstruction) — UNCHANGED in
      parameters.
    max_tokens_semantics: >-
      on .litertlm maxTokens is the CONTEXT window; the engine clamps up to
      the bundle's ≥1024 KV floor; 2048 ≥ floor → no clamp fires (ruling
      plan §4.4). Reply-length capping via maxOutputTokens is out of scope.
    backend: >-
      PreferredBackend.cpu kept (ruling plan §4.3) — deterministic across
      devices; avoids the documented Gemma-4 GPU half-precision digit-copy
      defect; the §6 CPU figures are what the 6 GB ruling rests on. GPU/NPU
      experiments are backlog F11/F9.
    pinned_source_verification: >-
      VERIFIED (P2 ruling, 2026-10-29 — pinned flutter_edge_ai_litertlm-1.8.6
      + flutter_edge_ai-1.11.4 source, the exact compiled artifacts): (a)
      maxTokens 2048 is the CONTEXT window, floor-clamped to 1024 only
      (litert_lm_engine.dart:34-66) — 2048 passes unchanged; the CPU
      fallback order for PreferredBackend.cpu is [cpu] (backend_preference
      .dart:132). (b) createChat's sampler params (temperature/topK/topP/
      seed) are ALWAYS attached to the session config on CPU/GPU
      (litert_lm_client.dart:1029-1057); only NPU discards them (argmax) and
      the app is CPU — so 0.3/1/30/0.85 take effect. topP 0.85 is explicit,
      beating the plugin's silent 0.95 default. (c) systemInstruction maps to
      systemMessage → template-native (F12 confirmed at source). (d)
      activationDataType is only read by the GPU executor; supportImage/
      supportAudio default false (text-only intended, F6). Upstream caveat,
      NOT an app defect: at the shipped native pin the engine-level sampler
      implements TopP (type 2) with top_k honored as a hint — the plugin's
      own comment marks that pairing "carried forward, not verified". No
      different inference settings are required for the E2B bundle; no P2
      follow-up.
    thinking: >-
      OFF — no thinkingTokenBudget parameter (it arrived in litertlm 1.18.0;
      this contract pins 1.8.6) and answers would slow; backlog F7 (plan §2).
  identity_string: gemma-4-e2b-it
  identity_sites:                       # plan §5-P2 item 3-5; all verified
    - lib/services/ai/model_download_service.dart:71 (_modelType — feeds
      _dao.setModelReady(modelType:) at :284 and :305)
    - lib/services/ai/gemma_service.dart:112 (setModelReady(modelType:))
    - lib/data/local/offline_model_dao.dart:37 (setModelNotInstalled row)
    - lib/data/local/offline_model_dao.dart:53 (setModelError row)
  identity_invariant: >-
    all four sites carry the SAME string 'gemma-4-e2b-it' — DAO/plugin
    identity and the DB must not drift (F5); coherence is a P2 acceptance
    grep (plan §5-P2 criterion 3).

# ---------------------------------------------------------------------------
# 3. Migration contract (plan §5-P1 item 3; pattern verified at
#    model_download_service.dart:206-224)
# ---------------------------------------------------------------------------

migration_contract:
  owner: >-
    lib/services/ai/model_download_service.dart — _migrateLegacyAssetIfPresent
    (:248-264 as implemented; v1.0.0 named the v2 function/shape — superseded
    by the P2 deviation ruling, plan §4.8)
  marker: "model_asset_v3"              # new SharedPreferences bool — plan §5-P1 item 3
  call_site: >-
    AMENDED (P2 deviation ruling, ratified 2026-10-29): the v3 migration is
    invoked from checkModelExists() — the gate seam — BEFORE the readiness
    read (:178 precedes :181), so the DAO reset lands before the status
    decision on the very launch it fires. checkModelExists is hit by EVERY
    launch path: OfflineModelGate.initState (main.dart:524), its re-check
    after install (main.dart:564), the download screen (download_prompt_screen
    .dart:76/:103), and transitively installModel (:306). ensureModelActive
    also runs it directly (:570) for the load-time rehydration path. The
    v1.0.0 call sites (installModel/ensureModelActive only) were UNREACHABLE
    for the migration's own target population — a healthy 1B user's status is
    ready, so installModel early-returns (:302-304), and ensureModelActive is
    only called when !hasActiveModel() (gemma_service.dart:89-90), which the
    installed base's auto-restore makes false. v2's pattern worked only
    because its target class (broken mirror 1B) had the gate OPEN; v3's
    target class has it CLOSED. v2 keeps its original call sites unchanged.
  trigger: >-
    AMENDED (P2 deviation ruling): marker absent AND the LEGACY ASSET ITSELF
    is present — _legacyAssetPresent() (:268-274):
    FlutterEdgeAi.activeModelSpec?.name == 'gemma3-1b-it-int4.task' OR
    FlutterEdgeAi.isModelInstalled('gemma3-1b-it-int4.task'). Marker present →
    return early, no uninstall. RATIONALE (both halves verified): the v1.0.0
    literal trigger (hasActiveModel() || dao.isModelReady(), "any model
    present") at the checkModelExists seam would fire on launch 2 for a
    CURRENT-E2B user (DAO ready → uninstall + DAO reset → gate forces a
    spurious 2.59 GB re-download). The legacy-asset probe kills both holes.
    Probe semantics verified against pinned core 1.11.4: isModelInstalled
    takes a model FILENAME (flutter_edge_ai.dart:360 doc), and
    activeModelSpec.name is the persisted filename on restore
    (mobile_model_manager.dart:216-218) — so an E2B-only user probes false on
    both legs (no marker churn, no uninstall), while a 1B user probes true on
    at least one leg (in-process active spec, or the repository record).
  steps:                                # ORDER IS NORMATIVE — plan §5-P1 item 3
    - "1. set marker model_asset_v3 = true FIRST (a crash can never loop the download)"
    - "2. FlutterEdgeAi.uninstallModel('gemma3-1b-it-int4.task') inside try/catch, tolerant of already-unregistered / file-missing — safe to continue"
    - "3. dao.setModelNotInstalled() — resets the DB row (DAO identity becomes 'gemma-4-e2b-it' per §2 identity_sites)"
    - "4. the download gate re-downloads the E2B asset on the next install path — no user-facing migration UI"
  failure_composition: >-
    VERIFIED ADDITION (P2 ruling): if v3 partially fails after its marker is
    set (e.g. setModelNotInstalled throws — the whole body is wrapped in
    try/catch, :249-263), the row can keep claiming ready while the 1B is
    uninstalled. The still-unset v2 marker back-stops exactly that class:
    the next ensureModelActive fires v2 (dao.isModelReady() true → its
    literal trigger), whose tolerant uninstall is a no-op and whose DAO reset
    opens the gate. No stranded user, no download loop. For E2B users v3
    never fires, so the partial-failure path is unreachable for them.
  untouched: >-
    the existing model_asset_v2 marker and its logic stay exactly as-is
    (:206-224 keeps serving v2); v3 follows the identical set-marker-BEFORE-
    uninstall pattern (F4: the plugin keys idempotency on the URL filename,
    so the new filename installs cleanly but the old 0.5 GB file would
    otherwise linger on disk).
  uninstall_id_note: >-
    'gemma3-1b-it-int4.task' is the OLD asset's filename (current _modelUrl,
    :69-70). After P2 it remains in lib/ at exactly two sites — the uninstall
    id + its comment (plan §5-P2 acceptance criterion 2).

# ---------------------------------------------------------------------------
# 4. Download timeout (plan §5-P1 item 4; F3; code sites re-verified)
# ---------------------------------------------------------------------------

download_timeout:
  gate_ceiling: >-
    _installTimeout (lib/services/ai/model_download_service.dart:44):
    Duration(minutes: 30) → Duration(minutes: 60), carrying the
    size-rationale comment (plan §5-P2 item 3).
  rationale: >-
    a 2,588,147,712 B (§1) transfer at ~1.5 MB/s ≈ 29 min — the 30-min
    ceiling exhausts before a legitimate transfer finishes and lands as
    "Download timed out. Please try again." with a partial file (plan §1.5
    install-ceiling row; F3).
  second_ceiling: >-
    VERIFIED ADDITION (this task): ensureModelActive carries its OWN inline
    .timeout(const Duration(minutes: 30)) at model_download_service.dart:501
    around the SAME re-download of the SAME asset on the load-time
    rehydration path. It moves to the same 60-minute ceiling so F3's failure
    class cannot resurface on rehydration. The plan names :44 explicitly;
    :501 is the second verified site of the identical ceiling and falls
    inside this timeout contract's scope. Flagged in the P1 report.
  unchanged_watchdogs: >-
    the 3-min zero-progress stall watchdog (:49) + CancelToken (:54, :293)
    are size-independent and reused as-is; the 60s slow-connection heuristic
    (:105-119) is unchanged (plan §1.5 stall-watchdog row).

