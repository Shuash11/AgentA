# Offline-model contract — Gemma 4 E2B via the LiteRT-LM engine (cycle-38 P1)
#
# Single source of truth for the on-device model swap implemented by
# plans/cycle-38 P2 (engine + model swap) and consumed by P3 (download-size
# copy). Authoritative file — code, comments and delegation prompts are never
# the contract. No second copy exists anywhere. A reader implements P2 from
# this file alone. Every figure cites its verified source: plans/cycle-38
# §1 unless stated otherwise (all plan figures verified live 2026-10-29);
# code sites were re-verified against the tree at recording time.
#
# Recorded 2026-10-29 (cycle-38 P1, contractor) — initial recording v1.0.0.
# No secret material: token VALUES never appear here; the HF-token threading
# is documented as no-op-preserving behavior (config key names only).

contract: offline-model-e2b
version: 1.1.0
status: active
# v1.1.0 (2026-10-29, Adviser P2-ruling): §3 migration trigger/call-site
# AMENDED (P2 deviation ratified — the recorded v1.0.0 trigger was
# unreachable for the installed base and self-resetting for E2B users at
# the gate seam); §7 new_exceptions corrected (LiteRtLmBundleException does
# not exist at the 1.8.6 pin); §5 download_service_comment site re-anchored
# :254 → :329 (the tree shifted with P2's insertion). No consumer break.

# §1  asset_identity — the downloaded artifact and its verified provenance
# §2  engine_contract — dependency pin, engine registration, install/load shapes, identity string
# §3  migration_contract — model_asset_v3 marker, uninstall of the 1B asset, re-download gate
# §4  download_timeout — install ceilings for the 2.59 GB transfer
# §5  ux_copy — the strings P3 implements verbatim
# §6  ram_budget — measured working set vs the user's ≤ 6 GB cap
# §7  error_surface — download errors (unchanged), engine-init errors, F13 override caveat, STOP divergences
# §8  system_prompt — template-native handling (the .task-era pollution disappears)
# §9  acceptance_criteria — P1's own gate (a-d) + P2 invariants this contract pins

