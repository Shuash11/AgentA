# ---------------------------------------------------------------------------
# 6. RAM budget (plan §1.4 measurements + §4.7 posture; binding cap from the
#    user directive 2026-10-29, plan header + §3)
# ---------------------------------------------------------------------------

ram_budget:
  binding_cap: "runtime RAM ≤ 6 GB (user directive, 2026-10-29 — plan header + §3)"
  measurement_source: >-
    the pinned plugin's Memory Diagnostics docs (fluttergemma.dev/docs/
    diagnostics) — first-hand Android measurements of Gemma 4 E2B on
    vivo 1933, Android 11 (plan §1.4).
  mechanism: >-
    LiteRT-LM mmaps the .litertlm file, so the RAM cost is the
    mapped-weights working set plus anonymous heap/KV/activations — NOT the
    2.59 GB file size (plan §1.4).
  measured_file_backed_bytes_mib:      # plan §1.4 table, verbatim
    CPU_app_choice: { before_load: 103.6, after_load: 800.5, after_one_prompt: 1043.2 }
    GPU:            { before_load: 102.3, after_load: 1390.3, after_one_prompt: 1413.2 }
  realistic_total: >-
    resident working set ≈ 0.8–1.05 GB on CPU (reclaimable file-backed pages)
    plus anonymous heap/KV/activations on top → realistic total process
    footprint ≈ 1.5–2.5 GB on device — the ≤ 6 GB cap holds with wide margin
    (plan §1.4).
  device_posture: >-
    comfortable on ≥ 4 GB-RAM phones; the cap holds on any phone that can
    store the 2.59 GB file (ruling plan §4.7). The smallest supported device
    class is verified by the advisory device proof (S5), not assumed.
  caveat: >-
    fileBackedBytes counts shared clean pages in full and GPU driver buffers
    land there on Adreno — treat the deltas, not absolutes, as the model's
    cost (plan §1.4).
  backend_ruling: >-
    CPU is the app's choice (§2 load_shape backend) — the CPU row above is
    what the 6 GB ruling rests on (plan §4.3).

# ---------------------------------------------------------------------------
# 7. Error surface (plan §5-P1 item 7 / F13 / F14; friendly strings verified
#    at model_download_service.dart:390-414 and gemma_service.dart:132-142)
# ---------------------------------------------------------------------------

error_surface:
  download_errors: UNCHANGED   # sealed DownloadException mapping, no variant added or reworded
  friendly_mapping:            # _friendlyDownloadError (model_download_service.dart:390-414)
    NotFoundError: 'The offline model file could not be found at its source. Check the download link.'
    UnauthorizedError_ForbiddenError: >-
      Download authorization required. The model source is gated — please
      confirm your HF token is valid and the model license has been accepted.
      Never share the token.
    RateLimitedError: 'Too many download attempts. Try again later.'
    NetworkError: 'No internet connection. Download will resume when you are back online.'
    CanceledError_and_CancelToken_isCancel: silent — back to notInstalled, no error
    ServerError_UnknownError: 'Download failed. Please try again.'
    TimeoutException: 'Download timed out. Please try again.'   # (:410-412) — the §4 ceilings land here
    other: 'Download failed. Please try again.'
    DownloadStalledException: 'Download stalled. Please try again.'   # (:394-396)
    note: >-
      the 401/403 copy above is cycle-36's, kept verbatim (plan §5-P1 item 7);
      raw plugin detail never reaches the UI (:363-366 doc).
  engine_init_errors:
    new_exceptions: >-
      BackendInitException only (v1.1.0 correction — LiteRtLmBundleException
      does NOT exist at the 1.8.6 pin; verified by grep over both pinned
      packages. The bundle-load failure surfaces as a generic
      Exception('Failed to create engine. Model may be invalid: …') or the
      actionable backend-constraint Exception — litert_lm_client.dart:925-935
      of the pinned package source).
    mapping: >-
      INTENTIONALLY fall into the existing string heuristics
      (_classifyLoadError, gemma_service.dart:132-142) → 'Offline model
      failed to load.' (or 'Offline model is not installed.' for the
      not-installed class).
    no_code_change: >-
      typed mapping of these exceptions is backlog F14 — P2 must NOT add
      exception-type branches this cycle (plan §5-P1 item 7).
  f13_override_caveat: >-
    GEMMA_MODEL_URL override becomes FORMAT-COUPLED: fileType
    ModelFileType.litertlm is hardcoded in BOTH install chains (§2
    install_shape), so overriding the URL to a .task asset fails at engine
    claim. Accepted — debug/enterprise escape hatch (F13, recorded plan
    §2). resolvedModelUrl (model_download_service.dart:84-85) still wins;
    AppConfig.gemmaModelUrl (app_config.dart:17,61) unchanged; no code
    change — this contract item only documents it (plan §5-P1 criterion c).
  token_posture: >-
    no new secret surface — the HF-token threading is untouched (§1
    token_threading, §2 install_shape token); the only secret path is
    unchanged from cycle-36 P4's verified state (plan §4.5).
  stop_divergences:            # plan §6 — STOP and report to the Orchestrator; no improvisation
    S1_pub_resolution: >-
      flutter pub get cannot resolve flutter_edge_ai_litertlm 1.8.6 with core
      ^1.11.4, or resolution moves the core/mediapipe pins (verified at plan
      time, plan §1.3 — a failure is NEW evidence).
    S2_pinned_source: >-
      the pinned litertlm 1.8.6 source diverges from this contract (e.g.
      LiteRtLmEngine export/constructor differs, or the engine cannot claim
      a ModelFileType.litertlm spec on the pinned core). No speculative
      patches.
    S6_asset_state: >-
      the asset URL or repo state changes at gate time — P4 re-verification
      fails (install URL HTTP 200 + Content-Length 2588147712, gated:false).
      Re-check the catalog before proceeding.
    others_note: >-
      S3 (CI native-assets failure), S4 (advisory device proof), S5 (RAM OOM)
      live in plan §6 and are outside this contract's figures — the plan file
      is authoritative for them.

# ---------------------------------------------------------------------------
# 8. System prompt — template-native handling (F12; plan §5-P1 delegation
#    scope item 8)
# ---------------------------------------------------------------------------

system_prompt:
  code_change: NONE
  behavior_shift: >-
    on .task, the system prompt reached the model as a '[System: …]' blob
    glued to the first user turn (cycle-36 F15); on .litertlm the bundle's
    chat template handles the system turn natively (<|turn>system markers,
    plan §1.2) — the .task-era prompt pollution disappears for free (F12).
  app_surface: >-
    createChat(systemInstruction: _systemInstruction) keeps its existing
    parameter (§2 load_shape) — the same call now lands natively in the
    template; gemma_service.dart is not touched for this.
  expected_quality_win: recorded, no work (plan §2 F12) — P2 must NOT "fix"
    or restructure the system-instruction path.

