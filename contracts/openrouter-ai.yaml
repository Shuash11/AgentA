# OpenRouter AI contract (cycle-36 P2; AMENDED cycle-37 P2 — v1.1.0;
# AMENDED cycle-37 P3b — v1.2.0)
#
# Governing plan: plans/cycle-36-openrouter-cloud-models.md (original
# authoring) + plans/cycle-37-hotfix-models-name-password.md (the
# amendment governing plan: §6-P2 — error rows CLOSED there, §4.5
# Ruling 5; §6-P3b — the v1.2.0 model-constant swap). This file is the
# single source of truth for both plans' P3 (OpenRouterService + full
# wiring) and P3b (model constants). Consumers implement exactly what is
# written here and never assume. No second copy exists anywhere.
#
# AMENDMENT RECORD (v1.0.0 → v1.1.0, 2026-10-28, cycle-37 P2): the
# v1.0.0 error table mapped errors by HTTP STATUS ALONE, and the shipped
# build received OpenRouter's harness-gate 403 while showing the generic
# "declined" copy — the body naming the true cause was discarded
# (openrouter_service.dart:231-247; incident plan §2.5). This amendment
# makes body parsing MANDATORY (§1 error_body_parsing), splits 403 into
# four classified rows (harness-gate FIRST), adds the 400-with-routing-
# metadata rule, the 200-with-error-body rule, and mid-stream message
# passthrough (§1), adds the matching classifier rows (§3 branch_table,
# harness-gate match key FIRST, and the v1.0.0 decline row retired),
# adds the service_tests coverage rows (§3), marks §2's model constants
# DECISION-PENDING (N13 — plan §4.5 Ruling 6: both inkling :free IDs are
# harness-gated; substitution/paid/drop is a USER DECISION; a v1.2.0
# amendment per plan §6-P3b may replace them), and adds the verbatim-
# body acceptance criterion (§5, plan §6-P3 criterion 6).
# Evidence for every new row: the P1 probe's verbatim harness-gate 403
# body (plan §2.5 — reproduced in §1; contains NO key material) and the
# live OpenRouter errors doc (fetched 2026-10-28, plan §2/§2.1).
# Change class: additive error-mapping rows — the wire request shape is
# UNCHANGED (not breaking).
#
# AMENDMENT RECORD (v1.1.0 → v1.2.0, 2026-10-28, cycle-37 P3b step 1; plan
# §6-P3b): the USER DECISION (N13) is CLOSED — Option A, keep names, swap
# engines (plan §4.5 Ruling 6; decision recorded 2026-10-28). The two
# harness-gated inkling :free IDs are REPLACED by the substitutes chosen
# from plan §6-P3b's verified-candidate table: Pro →
# nvidia/nemotron-3-ultra-550b-a55b:free, Flash →
# nvidia/nemotron-3.5-lightning:free. The display names "AgentA Pro" /
# "AgentA 2.1 Flash" are BINDING and UNCHANGED, as are the §3 enum values
# and the name-substring constraint (neither enum value contains
# 'pollinations' or 'image'; neither new model name does either). The wire
# request shape is UNCHANGED — including §1 reasoning {effort:"low",
# exclude:true}: Flash accepted it live (one real 200 on the fresh rotated
# key, 2026-10-28 — reasoning_tokens 148 performed + excluded, cost 0, no
# 400), so the §6-P3b payload-compat conditional (drop the effort
# sub-field) did NOT fire. Per-ID live-proof state is recorded in §2 under
# the §12 standing rule (ONE live request per NEW model ID BEFORE
# release): Flash PROVEN; Pro's budgeted proof request was consumed by an
# auth-transmission artifact (401 "Missing Authentication header" — the
# Authorization header was never sent; §4.4 precedent: a harness artifact
# is NOT evidence about the model) — the candidate is NOT falsified, no
# gate was hit, and the corrected one-live-request proof for the Pro ID is
# REQUIRED before P6 release; a harness-gate-style 403 there falsifies it
# → re-amendment with the next verified candidate (§4.5 STOP-new).
# §1 is otherwise UNCHANGED and model-agnostic; the 403_harness_gate row
# STAYS as the standing classifier row for ANY future gated model — the
# inkling IDs were removed from §2 BECAUSE of the gate, not the error row.
# §3 app_config consts + the §5 grep gates move to the new IDs. Change
# class: model-constant swap (additive per plan §6-P3b) — the wire request
# shape is UNCHANGED (not breaking).
#
# NO KEY VALUES ANYWHERE IN THIS FILE. The OpenRouter key is referenced
# only as the env name OPENROUTER_API_KEY (see §4 secrets posture).
#
# External facts (endpoint, auth, stream/error shapes, free-tier limits,
# reasoning semantics, error-body vocabulary) are live-doc verifications
# recorded in the governing plans (cycle-36 §1.2; cycle-37 §2, §2.1, §2.5,
# verified 2026-10-28) — not training knowledge. Internal facts are
# file:line citations from the plans, re-verified in the tree at
# contract/amendment time (cycle-37 P2 re-verified: classifier
# chat_error_classifier.dart:62-108; service openrouter_service.dart:
# 215-264, 330-332, 402-406, 435-439, 476-483).

contract: openrouter-ai
version: 1.2.0
status: active

# ---------------------------------------------------------------------------
# 1. External API — OpenRouter chat completions (consumed)
# ---------------------------------------------------------------------------

external_api:
  # OpenAI-compatible. Source: plan §1.2 (OpenRouter OpenAPI 3.1 +
  # auth + limits + reasoning-tokens pages, verified 2026-10-28).
  endpoint: POST https://openrouter.ai/api/v1/chat/completions

  auth:
    scheme: bearer
    header: "Authorization: Bearer <OPENROUTER_API_KEY>"
    key_source: AppConfig.openRouterApiKey (dart-define only — see §3/§4)
    notes: >-
      No required attribution headers — no HTTP-Referer requirement exists
      in the OpenAPI securitySchemes (plan §1.2). A User-Agent header is
      sent anyway, mirroring the GroqService SDK-UA pattern
      (groq_service.dart:21-22,134): "AgentA/1.0.0 (Flutter; OpenRouter)".

  request_body:
    # What WE send. Only `messages` is required by the API; we always send
    # the full shape below (plan §1.2/P2).
    model: string — exact model ID from §2 (one request = one model)
    messages: >-
      array of {role, content} objects; role is "system" | "user" |
      "assistant", content is string.
      # Order + window: system message FIRST, then the last 20 history
      # messages (dropping a trailing duplicate of the current message),
      # then the current user message. This mirrors GroqService
      # (groq_service.dart:82-96,111-123) — OpenRouterService is a
      # structural sibling (plan P3).
    stream: true (always — the app consumes the SSE stream)
    max_tokens: 4096
      # DECISION RECORDED (plan §1.2 asks the contract to pick one):
      # `max_tokens` is used, NOT `max_completion_tokens` (deprecated
      # alias sharing the same budget). 4096 is the documented F3
      # mitigation for the reasoning-budget hazard — see reasoning
      # hazard note below.
    temperature: 0.7
      # Mirrors GroqService (groq_service.dart:139,240) per the
      # structural-sibling rule; plan/delegation left the value open.
    reasoning:
      effort: "low"      # documented F3 mitigation — retained under v1.2.0; accepted live by the Flash ID (§2 live_proof)
      exclude: true      # documented F3 mitigation (reasoning text excluded from reply)

  response_200_non_stream:
    # Recorded for completeness; the app's primary path is streaming.
    shape: >-
      { id: string, created: integer, model: string, object: string,
        usage: object,
        choices: [ { message: { role: string, content: string|null },
                     finish_reason: string } ] }
    content_note: >-
      content may be null/empty with finish_reason "length" when the
      token budget is spent on reasoning (see hazard note below).

  streaming:
    content_type: text/event-stream
    chunk_shape: >-
      SSE lines "data: {json}"; each JSON chunk has object:
      "chat.completion.chunk" and choices[].delta; TEXT CONTENT lives in
      choices[].delta.content (string pieces, possibly null).
    ignored_fields:
      - choices[].delta.reasoning_details — reasoning tokens, EXPLICITLY
        IGNORED. Parsers reading only delta.content skip them naturally
        (plan §1.2; legacy alias delta.reasoning behaves the same).
      - SSE comment lines (any line not starting with the data prefix)
        are skipped.
    sentinel: 'data: [DONE] — end of stream.'
    malformed_chunks: counted + logged with a partial-response warning at
      a threshold of 10 — same pattern as groq_service.dart:23-30,54-67.

  mid_stream_error_events:
    # LOAD-BEARING (plan F2). A rate limit hit AFTER streaming starts is
    # NOT an HTTP status — it arrives as an SSE event inside the stream:
    shape: >-
      data: { error: { code: integer, message: string, metadata?: object },
              choices: [ { delta: {...}, finish_reason: "error" } ] }
    required_handling: >-
      On finish_reason "error" the stream must END with a FRIENDLY ERROR
      raised (mapped via the table below) — never a silent empty reply,
      never raw JSON in the UI. The Groq parser pattern
      (groq_service.dart:270-291) reads only delta.content and would
      truncate silently; OpenRouterService MUST add this branch.

  reasoning_budget_hazard:
    # Plan F3 (documented, load-bearing). Reasoning tokens count against
    # max_tokens; a Groq-style max_tokens: 2048 request risks finishing the
    # budget on reasoning → finish_reason "length" with EMPTY content.
    # (The v1.0.0/v1.1.0 note that BOTH §2 models default reasoning ON at
    # effort "high" was inkling catalog data; per-model reasoning defaults
    # for the v1.2.0 IDs are NOT re-verified — see §2 reasoning_default.)
    mitigations_in_request: >-
      max_tokens 4096 + effort "low" + exclude true (documented mitigation
      set — UNCHANGED under v1.2.0; accepted live by the Flash ID, §2
      live_proof. The "262,144 completion cap" figure was inkling catalog
      data and is NOT re-verified for the v1.2.0 IDs — unverified, not
      load-bearing: the request shape is unchanged.)
    required_handling: >-
      If the stream/response ends with finish_reason "length" and no
      content was yielded, raise a friendly error (copy in table below),
      not a silent empty reply.

  error_body_parsing:
    # cycle-37 P2 amendment (plan §6-P2 item 1; §4.4 Ruling 2). Governs the
    # error_table below: v1.0.0 mapped by status alone; that masking is
    # what cost a full diagnostic round (incident plan §2.5).
    rule: >-
      On EVERY non-200 response — pre-stream HTTP status or mid-stream
      error event — and on any 200 body holding only an `error` object,
      the service MUST parse the error body and map THROUGH the
      error_table using its parsed fields. The status code alone is never
      again sufficient: it only selects the fallback row when the body
      matches none.
    parsed_fields:
      error.code: >-
        integer (or numeric string) — the HTTP-equivalent code; feeds the
        status-row selection exactly as today (openrouter_service.dart
        _serviceMessageForErrorCode keeps working for it).
      error.message: >-
        string — the provider's own cause + remedy sentence (e.g. the
        harness-gate remedy points at openrouter.ai/apps, plan §2.5).
        NEVER user-facing raw; feeds row selection + the debug surface.
      error.metadata:
        # (v1.1.0 carried this as an unparseable plain-scalar + bullet mix;
        # repaired v1.2.0 to parseable structure — content unchanged.)
        description: >-
          object — the discriminating keys (live errors doc, plan §2.1;
          structure verified against the P1 probe's verbatim body, plan
          §2.5)
        discriminating_keys:
          - limit_source: >-
              budget/key-limit class — live-doc values
              openrouter_guardrail_budget / openrouter_workspace_budget /
              openrouter_key_limit
          - error_type: >-
              moderation/permission class — live-doc values incl.
              content_policy_violation / refusal / permission_denied
          - provider_name: >-
              moderation metadata (live doc §2.1)
          - routing_funnel: >-
              array of {step, endpoint_count} — routing-class discriminator
              (P1 probe §2.5)
          - failed_routing_step: >-
              string SIBLING of routing_funnel inside error.metadata — NOT
              nested inside routing_funnel[] (P1 probe §2.5 verbatim body);
              e.g. "Gate Free Endpoints by Agentic Harness"
    precedence:
      - >-
        1. Metadata-match rows first: if error.metadata matches a
        classified row below (harness-gate FIRST, then budget, then
        moderation), that row's copy applies regardless of the status
        code's default row — this is what makes a routing-class 400-shape
        never read as a payload defect (plan §6-P2 item 3).
      - >-
        2. No metadata match → the status row (403 resolves through its
        four split rows below; 400/other-4xx → other_4xx; etc.).
      - >-
        3. Truly unknown shape (no parseable error object) → the
        status-code fallback / generic copy exactly as v1.0.0 did.
    debug_surface:
      log: >-
        the raw parsed error body (message + code + metadata) is logged
        at kDebugMode ONLY (plan §4.4 Ruling 2). Safe because the body
        never contains key material (plan §2.5); user text inside e.g.
        metadata flagged_input stays debug-only — never user-facing
        beyond the single mapped sentence (P3 acceptance criterion 4).
      typed_failure: >-
        OpenRouterServiceException carries the parsed fields (code,
        message, metadata) alongside the mapped user-facing message, so
        the classifier, callers, and tests consume the PARSED BODY — the
        developer-visible truth — while the user-facing `message` stays
        the mapped service_message (friendly copy never embeds more than
        one sentence of provider payload).

  error_table:
    # HTTP error body (plan §1.2): { error: { code: integer, message: string,
    # metadata?: object } } — codes 400/401/402/403/404/408/413/422/429/
    # 500/502/503/524/529. Grouped below with the friendly copy the
    # SERVICE throws and the classifier maps (§3 classifier table).
    # Copy tone follows the existing classifier/service strings
    # (chat_error_classifier.dart:38-58; groq_service.dart:156-176).
    # AMENDED v1.1.0 (cycle-37 P2): every row is reached THROUGH
    # error_body_parsing above — status alone selects only fallbacks.
    # Rows 401/402/408/429/other_4xx/5xx are unchanged from v1.0.0; the
    # single 403 row is REPLACED by the four classified rows below
    # (plan §6-P2 item 2 — the old "declined" copy is retired: it was the
    # misleading generic shown for the harness-gate 403, plan §2.5).
    "401":
      meaning: invalid or missing API key
      service_message: "Invalid OpenRouter API key. Please check OPENROUTER_API_KEY."
      friendly: "Chat service is not configured correctly."
    "402":
      meaning: >-
        free-tier exhaustion — negative credit balance also errors free
        models (plan §1.2); daily free cap reached behaves here
      service_message: "OpenRouter free quota exhausted (daily limit or account balance)."
      friendly: "Free chat quota reached for today. Try again tomorrow or switch models."
    "403_harness_gate":
      # FIRST match of the 403 split (plan §6-P2 item 2, evidence §2.5).
      match_key: >-
        parsed metadata.failed_routing_step == "Gate Free Endpoints by
        Agentic Harness" OR parsed error.message contains "only available
        on agentic harnesses"
      meaning: >-
        OpenRouter's free-endpoint routing policy restricts this model's
        `:free` endpoint to agentic-harness callers (AI coding tools) —
        the model id may still be LISTED free on the catalog while
        unreachable for plain API callers (plan §2.5). NOT a key,
        account, budget, moderation, or app defect; key rotation will not
        fix it.
      evidence_body: >-
        {"error":{"message":"thinkingmachines/inkling:free is only
        available on agentic harnesses. Try plugging it into a coding
        agent or productivity app listed on https://openrouter.ai/apps",
        "code":403,"metadata":{"routing_funnel":[{"step":"Initial
        Endpoints","endpoint_count":1}],"failed_routing_step":"Gate Free
        Endpoints by Agentic Harness"}}}
        # Verbatim P1 probe body (plan §2.5; byte-exact, contains NO key
        # material) — the P3 unit-test fixture (§3 service_tests).
        # PROVENANCE (v1.2.0): this row STAYS after the model-constant
        # swap — it is the standing classifier row for ANY future
        # harness-gated model (match keys are model-agnostic). The inkling
        # IDs were removed from §2 BECAUSE of this gate, not this row.
      service_message: "OpenRouter blocked this model: <model id> is restricted to agentic harnesses on the free tier."
        # <model id> = the request's `model` parameter (the exact §2
        # string), substituted at throw time. The provider's own remedy
        # sentence from error.message ("Try plugging it into a coding
        # agent…") is preserved on the typed failure's parsed message +
        # the kDebugMode log (error_body_parsing.debug_surface) — the
        # user copy below states the app's own remedy instead.
      friendly: "This model is restricted by its provider to certain AI tools on OpenRouter's free tier. Please pick another model."
        # Verbatim plan §6-P2: the provider's own remedy class, stated
        # honestly; never "try rephrasing", never blames the user's
        # wording, never the old generic "declined" copy.
    "403_budget_key_limit":
      match_key: >-
        parsed error.metadata.limit_source present (live-doc values:
        openrouter_guardrail_budget / openrouter_workspace_budget /
        openrouter_key_limit — plan §2.1)
      meaning: >-
        a spending limit on the key/workspace/guardrail budget is
        reached; the live doc has this class reject with 403 (not 402),
        so the status row alone would mislead (plan §2.1)
      service_message: "OpenRouter key spending limit reached (403)."
      friendly: "Your OpenRouter key has reached its spending limit. Raise or remove the key's limit in the OpenRouter dashboard, then try again."
        # Plan §6-P2: names the spending limit and the user's remedy
        # (raise/remove the key's limit in the dashboard) — never "try
        # rephrasing".
    "403_moderation_guardrail":
      match_key: >-
        parsed error.metadata.error_type is content_policy_violation or
        refusal, OR the parsed error.message is a guardrail block
        ("Request blocked:" + patterns — plan §4.4 map)
      meaning: >-
        the provider's safety layer blocked this request
        (moderation/guardrail); metadata may carry provider_name and the
        flagged input (debug-only, plan §2.1)
      service_message: "OpenRouter blocked this request (safety layer)."
      friendly: "The AI service declined this request: the provider's safety layer blocked it. Please try again or switch models."
        # Plan §6-P2: keeps the decline framing and includes that the
        # request was blocked by the provider's safety layer — no
        # "rephrasing" advice. (The word "declined" here is the mapped
        # USER copy, not a classifier match key — the service_message
        # above deliberately avoids it so the generic declined row at
        # chat_error_classifier.dart:99-100 can never preempt this row.)
    "403_permission_other":
      # Residual row: any 403 whose parsed body matches none of the three
      # rows above (incl. error_type permission_denied, region/permission
      # restrictions, and bodies with no usable metadata).
      meaning: an account/key-level restriction or unclassified 403
      service_message: "OpenRouter refused the request (403): account or key restriction."
      friendly: "Your OpenRouter account or API key is restricted from this request. Check your OpenRouter account settings or switch models."
        # Plan §6-P2: names an account/key restriction; no rephrasing
        # advice.
    "408":
      meaning: request timeout
      service_message: "OpenRouter request timed out."
      friendly: "Connection timed out. Check your internet connection."
    "429":
      meaning: >-
        rate limit — free tier caps: 20 requests/minute AND 50 requests/day
        for accounts with <10 credits purchased all-time (1000/day at ≥10);
        the response may carry Retry-After (honored like GroqService,
        groq_service.dart:32-52)
      service_message: "OpenRouter rate limit exceeded (free tier: 20/min, 50/day)."
      friendly: "Cloud chat is rate limited (free tier: 20 requests/min, 50/day). Wait a moment and try again."
    other_4xx:  # 400/404/413/422 and any unlisted 4xx
      meaning: bad request / unknown model / payload too large / validation
      routing_metadata_first:
        # AMENDED v1.1.0 (plan §6-P2 item 3). When the parsed body
        # carries metadata.routing_funnel or metadata.failed_routing_step,
        # classification uses those fields FIRST — a routing-class
        # failure, not a payload defect: run the metadata-match rows
        # (403_harness_gate etc.) before this row's copy. Probe attempt
        # 1's R2 artifact (plan §4.4) is why the distinction matters: a
        # routing 400-shape must never be described as an invalid
        # request. A routing step that matches no classified row falls
        # back to THIS row's copy, with the parsed fields still carried
        # on the typed failure + debug log (never lost).
      service_message: "OpenRouter request error: <status>"
      friendly: "The selected AI model failed to respond. Please try again."
    5xx:  # 500/502/503/524/529
      meaning: OpenRouter/upstream server error
      service_message: "OpenRouter server error: <status>"
      friendly: "The AI service is temporarily unavailable. Please try again."
    mid_stream_finish_reason_error:
      meaning: SSE event per mid_stream_error_events above (map the
        embedded error through this same table; unknown → generic)
      body_parsing_passthrough:
        # AMENDED v1.1.0 (plan §6-P2 item 5; delegation scope 4). The
        # embedded error event gets the SAME body parsing as an HTTP
        # error — code + message + metadata through the same rows — not
        # code-only (openrouter_service.dart:435-439 reads only
        # error.code today; _parseSseEvent:504-508/:523-526 discards the
        # rest). The parsed message + metadata inform the mapped friendly
        # copy per the same rows whenever the class is NOT 500-masked; a
        # 500-class code keeps the 5xx row's fixed generic copy (the raw
        # message stays debug-only).
      friendly: >-
        same mapping as the HTTP row for that code — INCLUDING the
        metadata rows (a mid-stream 403 harness-gate event maps to the
        403_harness_gate copy); unknown →
        "The selected AI model failed to respond. Please try again."
    empty_content_length_finish:
      meaning: reasoning-budget exhaustion (hazard above)
      friendly: "The model used its full response budget. Please try again."
    key_not_configured_local:
      meaning: empty or placeholder key in config (mirrors the Groq guard,
        groq_service.dart:103-108)
      service_message: "OpenRouter API key not configured. Please set OPENROUTER_API_KEY via --dart-define."
      friendly: "Chat service is not configured correctly."

  free_tier_limits_context:
    # Recorded so P3/P5 can reason about quota UX; NOT consumed this cycle.
    minute_cap: 20 requests/minute on :free variants
    day_cap: 50 requests/day (<10 credits all-time; 1000/day at ≥10 credits)
    introspection: GET https://openrouter.ai/api/v1/key exposes
      free_model_daily_requests (not wired into the app this cycle)

# ---------------------------------------------------------------------------
# 2. Model constants (user's binding mapping)
# ---------------------------------------------------------------------------

# USER'S BINDING MAPPING — DECIDED (cycle-37 §4.5 Ruling 6; N13 CLOSED by
# the user's Option A decision, recorded 2026-10-28): the DISPLAY NAMES
# below are binding and unchanged; the ENGINES were swapped by this v1.2.0
# amendment. The original v1.0.0 mapping (small → inkling-small, strong →
# inkling; plan §1.1, live catalog GET /api/v1/models verified 2026-10-28,
# 464 models) became unreachable for plain API callers when OpenRouter's
# agentic-harness gate closed the :free endpoint class (plan §2.5 — see §1
# 403_harness_gate). These remain fixed constants — never parameterized,
# never extended (paid variants out of scope).

model_constants:
  # DECIDED — Option A (user decision recorded cycle-37 §4.5 Ruling 6 +
  # Orchestrator delegation 2026-10-28): keep names, swap engines. The
  # v1.1.0 decision_pending: N13 marker is REMOVED. Substitutes chosen from
  # plan §6-P3b's verified-candidate table (live catalog 2026-10-28).
  # Per-ID live-proof state is recorded below under the §12 standing rule
  # (ONE live request per NEW model ID BEFORE release — the release gate,
  # not a gate on this amendment).
  flash:
    model_id: "nvidia/nemotron-3.5-lightning:free"
    display_name: "AgentA 2.1 Flash"   # exact picker text (binding — unchanged)
    role: small / fast tier
    replaces: >-
      thinkingmachines/inkling-small:free (removed v1.2.0 — the inkling
      :free class is harness-gated, plan §2.5; the gate hit is PROVEN for
      inkling:free by §1's verbatim body, inferred same-gated for
      inkling-small:free, unverified — probe budget consumed)
    catalog_facts:   # plan §6-P3b candidate table (live catalog 2026-10-28)
      architecture: 30B MoE / 3B active
      context_window: 1000000
      tier: free (prompt 0 / completion 0 — :free class; live-confirmed usage.cost 0)
      supported_parameters: reasoning (reasoning_effort NOT listed on catalog)
      listed: 2026-08-11
    live_proof:   # §6-P3b verification gate; proof report referenced, not embedded
      status: >-
        200 — one real request, 2026-10-28, fresh rotated key env-only
        (§4.1(4) hygiene; zero key material in any record)
      routed_model_confirmed: >-
        nvidia/nemotron-3.5-lightning:free — the response's model field
        (server-routed to the new constant, not the old inkling-small ID)
      cost: 0 (usage.cost 0 — free tier confirmed live)
      reasoning_compat: >-
        ACCEPTED reasoning {effort:"low", exclude:true} — 200 with 148
        reasoning tokens performed then excluded, no 400, no retry needed.
        The catalog note (reasoning_effort not listed) is CONSERVATIVE —
        the §6-P3b payload-compat conditional (drop the effort sub-field)
        did NOT fire; §1's reasoning config is unchanged.
      proof_report_ref: >-
        C:\Users\joashua\AppData\Local\Temp\opencode\P3b-proof-report.md
        (session-only, §4.1(4); contains no key material — referenced,
        not embedded)
      verdict: >-
        WORKS — verified reachable, honest answer delivered, no
        harness-gate, no misleading decline copy
    reasoning_default: >-
      not re-verified for this ID (the "enabled by default, effort high"
      note was inkling catalog data); the §1 mitigation set is retained
      regardless
    max_completion_tokens: >-
      not re-verified for this ID (plan §6-P3b's table records context
      window + supported_parameters only; the 262,144 figure was inkling
      catalog data) — unverified, not load-bearing: the request shape is
