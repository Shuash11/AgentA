    the app-pubspec build hook (build_hook below); BUMP
    flutter_edge_ai_mediapipe 1.0.8 → ^1.2.5 (RETAINED); REMOVE
    flutter_edge_ai_litertlm 1.8.6. No other dependency enters (S3).
