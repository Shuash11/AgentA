error_surface:
  download_errors: UNCHANGED            # the sealed DownloadException mapping (the E2B contract §7 friendly_mapping, carried through the qwen15b contract §7) is REUSED verbatim — no variant added or reworded
  download_errors_note: >-
    The 401/403 copy stays cycle-36's verbatim (the E2B contract §7
    friendly_mapping); this asset is UNGATED (§1) so the class should
    not fire, but the mapping is untouched (plan §8 — no token surface,
    no security phase).
  expectedsize_integrity: >-
    A corrupted/truncated download FAILS AT INSTALL via the
    expectedSize check (§1 expected_size / §2 install_shape — core
    2.5.5's documented size-integrity check on non-catalog network
    installs): it DIES AT INSTALL, NEVER AT LOAD (plan §5.5), and it
    surfaces through the EXISTING download-failure classes — NO new
    branch.
  failure_classes: >-
    The cycle-40 failure classes are REUSED unchanged (the qwen15b
    contract §7 discipline): the unsupportedAbi marker/class now ALSO
    keys the §3 message-only class (ABI re-enters — the mapping
    machinery stayed in code and becomes a selection input again,
    §3 abi_reenters_note); the incompatible-message mapping keys the
    §9 message_only_wording (both reasons).
  engine_claim_failures: >-
    A llama engine-claim failure — the resolved core 2.5.5 + connector
    cannot claim ModelType.llama + ModelFileType.gguf — is a STOP S2,
    NO speculative patches (the qwen15b contract §7 engine_claim
    discipline; plan §9 S2). The step-0 smoke (§6
    branch_decision_gate) runs BEFORE ANY APP SURGERY and is S2's
    empirical arm.
  watchdog_extension: >-
    The app's stall watchdog EXTENDS TO GENERATION via
    session.stopGeneration() on timeout (plan §5.5) — §7 leg (iii).
  token_posture: >-
    No new secret surface — the HF-token threading is untouched (§1
    token_threading); this asset needs NO HF token. Only config KEY
    names appear anywhere (GEMMA_MODEL_URL / HF_TOKEN via AppConfig) —
    never values.
  stop_divergences: >-
    THE PLAN FILE IS AUTHORITATIVE for the STOP rules (the qwen15b
    contract §7 others_note pattern — plans/cycle-46-minicpm5-llama.md
    §9); summarized with their triggers:
    S1 (pins/cascade, P2): pub get resolving anything OTHER than the
    §2 cascade set — a core version materially above 2.5.x, a llama
    connector ≠ 0.0.x-compatible, a forced mediapipe jump beyond 1.2.x,
    ANY reappearance of litertlm → STOP for Adviser re-ruling (no
    quiet substitutions).
    S2 (pinned-source + smoke, P2): the §2 s2_pinned_source_verify_items
    (a)–(e) diverging from the resolved sources, OR the step-0
    smoke failing (§6 branch_decision_gate) → STOP, report verbatim;
    pre-stated re-rules: (i) if the 0.15.1 pin cannot load the file,
    check for a connector release pinning a newer llamadart and
    re-rule on the version bump; (ii) if no connector release helps,
    ladder rung (b) stands and the cycle stops honestly with the
    research recorded (plan §7).
    S3 (no new packages): only the §2 cascade set enters pubspec; any
    additional dependency → STOP.
    S4 (asset drift, P4): the GGUF's live state at gate time (bytes,
    sha256, gated) diverging from §1 → STOP, re-check the catalog,
    re-rule (the C38/C42 pattern).
    S5 (migration safety, P2): any stranded download, any uninstall
    loop, any uninstall of the SELECTED asset, or any v5-semantics
    break in the §4 compositions → phase FAIL; fix before review (the
    no-stranded-downloads rule is absolute).
    S6 (RAM honesty + the device gate): any surface offering the GGUF
    on an ineligible device (no arm64-v8a, or < 4 GB without the
    override) → phase FAIL; the estimated-peak language (§5) is an
    ESTIMATE everywhere it appears — never presented as measured; a
    materially higher MEASURED figure at the smoke or device gate →
    STOP → the §1 fallback_ladder, never an infinite fix loop.
    S7 (the thinking discipline, AS AMENDED at v1.1.0 — §6.2; the
    original row "S7 (thinking-loop guard): §7 s7_gate — any phase
    shipping thinking without all five = phase FAIL" is
    SUPERSEDED-NEVER-SHIPPED, kept as the §7 record): thinking does NOT
    ship this cycle — the TWO surviving invariants: (1) enableThinking:
    false passed EXPLICITLY on EVERY chat creation (never omitted,
    never defaulted); (2) any stray thinking content (ThinkingResponse
    tokens or think-span text) is DROPPED at the service seam — never
    rendered, never persisted to the transcript DB, never re-sent in
    history; no thinking UI surface exists (no toggle, no labels, no
    preference key). Any phase surfacing, persisting, or UI-ing
    thinking content = phase FAIL. (The general chat requirements —
    maxOutputTokens 2048, stopGeneration(), streaming, the watchdog —
    are NOT S7 legs; they stand under §2 load_shape / §10
    watchdog_extension.)
    S8 (the unqualified-path honesty): the connector's
    physical-Android status is stated in the release notes and the
    picker copy stays capability-honest; the owner's device test (P5)
    is the qualification; a device failure → ladder rung (b): a
    one-line spec re-point to the .task, a PATCH release, the research
    recorded — never an infinite fix loop, never silent.
    REFINEMENT CLAUSE (non-blocking): the owner's device facts may
    refine the RAM floor or the minSdk finding — they never block the
    work (plan §9).

