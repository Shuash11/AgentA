    llama.cpp pin; (e) whether sampler params (top_p/min_p) are exposed
    at chat creation (F6). ANY divergence → STOP, report, re-rule. THE
    STEP-0 SMOKE (plan §7) IS S2'S EMPIRICAL ARM — a smoke failure is a
    STOP with the pre-stated re-rules (§10 stop_divergences).

# ---------------------------------------------------------------------------
# 3. Selection eligibility table (plan §5.3 — BINDING; the C42 machinery,
#    ONE KEY CHANGED: ABI re-enters selection. Runtime self-reporting —
#    no user input decides WHICH model; the ONE user input is the C43
#    consent gate, unchanged)
# ---------------------------------------------------------------------------

eligibility_table:
  shape: >-
    ONE selection class, AUTOMATIC, runtime self-reporting — the C42
    machinery (the DeviceCapabilities seam: SUPPORTED_ABIS + totalMem;
    the qwen15b contract §3 shape discipline carries), with ONE KEY
    CHANGED (plan §5.3): the eligibility verdict consults the ABI
    AGAIN. From the moment the spec table points at the GGUF spec, it
    is the ONLY spec any eligible device is offered.
  keys: >-
    TWO capability keys, joined by the ONE user-consent input:
    (1) arm64-v8a ∈ SUPPORTED_ABIS (the ABI verdict — RE-ENTERED,
    plan §5.3); (2) totalMem (the 4 GB floor — unchanged). The consent
    input is the persisted C43 override ack (SharedPreferencesAsync,
    key "offline_ram_override_ack" — the qwen15b contract §3
    under_floor_override record; a user PREFERENCE, never auto-cleared).
  classes:                              # the table — binding, plan §5.3
    gguf_eligible_class: >-
      arm64-v8a ∈ SUPPORTED_ABIS AND totalMem ≥ 4 GB → the GGUF spec
      (THIS contract §1/§2): identity minicpm5-2b-q4km, install
      URL/size/sha/expectedSize per §1, engine per §2. The
      'Model size: ~1.6GB' chip is UNIVERSAL on this class (§9).
    under_floor_override_class: >-
      arm64-v8a AND totalMem < 4 GB → the C43 OVERRIDE PATH (plan
      §5.3): the honest warning renders FIRST + the "Download anyway"
      button — consent-gated, warning-first, never re-nagged, never
      silently green (the C43 machinery carries UNCHANGED, plan §2.5;
      the qwen15b contract §3 under_floor_override + §6
      under_floor_first_use/under_floor_post_ack records are the
      governing copy discipline). The RAM honesty is the §5
      estimated-peak wording (plan §5.3): any peak figure on these
      surfaces stays ESTIMATE language — never presented as measured
      (S6). The owner's device (OPPO CPH2591, arm64, 3.64 GB RAM,
      cycle-44 §5-P1) rides this path AS TODAY. After the ack the SAME
      GGUF spec becomes eligible — below-floor + ack ⇒ eligible; the
      override never selects a different model.
    message_only_class: >-
      NO arm64-v8a → message-only, NO CTA (plan §5.3): the ABI clause
      RETURNS to the wording — llama.cpp ships arm64-v8a + x86_64 ONLY,
      so 32-bit devices that could run the .task LOSE offline AI (F4).
      The wording carries BOTH reasons (RAM floor / no arm64-v8a) per
      the eligibility class (plan §5.7; §9 message_only_wording). The
      fail-closed primitive carries: an UNREADABLE totalMem arrives as
      'floor not cleared' → message-only (the qwen15b contract §3
      under_floor_override unreadable_edge disposition — carried
      unchanged, flagged not silently resolved; the owner's device
      facts may refine it, never block — plan §9 refinement clause).
  abi_reenters_note: >-
    ABI RE-ENTERS SELECTION after C42-P2b removed it — a GGUF-path
    consequence, honestly recorded (plan §3 F4). The unsupportedAbi
    failure-class mapping STAYED in code through C42-C45 (the qwen15b
    contract §3 unsupportedAbi_mapping_note) — it is now a SELECTION
    input again, not only a failure-class mapping. The
    isOfflineAiSupported() seam already provides the verdict (plan §3
    F4).
  one_active_model: >-
    the plugin holds ONE active model — satisfied by construction: each
    device resolves exactly ONE spec from this table and installs
    exactly that model (the qwen15b contract §3 one_active_model
    discipline carries; plan §5.3).
  consumers: >-
    the resolved GGUF spec feeds: both install chains (§2
    install_shape), the identity sites (§4 identity_semantics), the
    gate/download/card/picker states (§9), and the migration trigger
    (§4) — from the SINGLE class. The established render sites
    (main.dart the gate, download_prompt_screen.dart the screen,
    chats.dart the card, model_picker_sheet.dart the picker — the
    qwen15b contract §3 consumers record, re-verified 2026-11-01) are
    re-verified at P2 per the header anchor policy.

# ---------------------------------------------------------------------------
# 4. Migration — the v6 question (plan §5.4 — BINDING). THE RULING IS
#    "NO NEW MARKER": the C44 v5 reconciliation ALREADY generalizes to
#    the GGUF spec. A model_asset_v6 marker exists ONLY on a PROVEN gap.
# ---------------------------------------------------------------------------

migration_v6:
  ruling_no_new_marker: >-
    (plan §5.4) NO new marker is ruled. The C44 v5 reconciliation
    ALREADY generalizes: the moment the spec table points at the GGUF
    filename (selectedFileNameFor derives MiniCPM5-2B-Q4_K_M.gguf from
    §1 install_url), the shipped .task
    (Qwen2.5-1.5B-Instruct_multi-prefill-seq_q8_ekv4096.task) and any
    E2B straggler (gemma-4-E2B-it.litertlm) become FOREIGN by v5's OWN
    trigger legs — and v5's sweep uninstalls them, clears a stale
    active identity, resets a lying DAO row, and the gate honestly
    offers the fresh GGUF install (the C44 §5-P2 Ruling 2 semantics).
    ZERO new migration code is expected (plan §7 criterion 5).
  authority: >-
    The GOVERNING SEMANTICS of v5 are recorded in contracts/
    offline-model-qwen15b.yaml §4b (as amended) — this contract
    REUSES them unchanged, it does not restate or amend them: the
    three state-keyed legs, the composite probe, the verified-clean
    marker semantics, the identity-comparison rule, the caller-guard
    drop, the UNKNOWN doctrine.
  state_keyed_lineage: >-
    THE V3/V4 LESSON IS BINDING IN V5'S DESIGN and this swap relies on
    exactly it (the qwen15b contract §4b): the trigger keys on the
    ACTUAL STATE, never a generic has-model condition — (a) the
    FOREIGN-FILE leg (listInstalledModels() contains ids ≠ the derived
    selected filename; when spec == null every id is foreign); (b) the
    FOREIGN-ACTIVE leg (hasActiveModel() AND the active spec's identity
    ≠ the selected filename); (c) THE LIE leg (the DAO claims installed
    AND the plugin's file probe says the selected file is NOT installed
    AND the active identity ≠ the selected filename) — THE COMPOSITE
    PROBE IS NORMATIVE: BOTH plugin probes must agree the selected asset
    is gone before the DAO is touched, so a single lying probe can
    never loop the download. The UNKNOWN doctrine carries: a pass that
    cannot READ the state performs NO mutation and writes NO marker.
  compositions: >-
    (plan §5.4 — P2 MUST verify all FOUR with tests BEFORE relying on
    the generalization; each test-proven, plan §7 criterion 5):
    (1) BOTH-ASSETS — a device holding a legacy asset (.task or E2B
    straggler) + the GGUF already downloaded → the foreign file
    uninstalled, the GGUF file AND DAO row preserved, NO re-download;
    (2) THE USER'S-DEVICE SHAPE — a foreign file active + the DAO row
    ready + the GGUF absent → the foreign file uninstalled, the
    identity cleared, the row reset, the gate offers the fresh GGUF
    install; (3) A HEALTHY-GGUF DEVICE → ZERO mutations (no uninstall,
    no reset, marker-independent); (4) MESSAGE-ONLY-HOLDING-ANY-FILE →
    swept (every id is foreign when spec == null).
  v6_marker_conditional: >-
    (plan §5.4) ONLY IF A GAP IS PROVEN does a model_asset_v6 marker
    get added, per the C44 marker semantics (written ONLY after the
    body proves the state clean — verified-clean, never marker-first;
    the qwen15b contract §4b marker_semantics). The P2 report states
    WHICH gap (if any) demanded it (plan §7 criterion 5). Otherwise
    v2/v3/v4/v5 markers and their logic stay BYTE-FOR-BYTE untouched
    (plan §5.4).
  identity_semantics: >-
    The NEW spec's identity string is minicpm5-2b-q4km (plan §5.1).
    The four-site identity invariant carries (the qwen15b contract §2
    discipline): the spec table is the ONLY place the string is
    written; DAO/plugin identity and the DB must not drift. The C44
    identity-comparison rule carries (isSameModelIdentity — equal
    strings OR the candidate being the plugin-baseName of the fileName;
    ONE-DIRECTIONAL) with an S2 verify note: that rule was verified
    against pinned core 1.11.4 — P2 RE-VERIFIES the plugin's naming
    semantics for .gguf against the RESOLVED core 2.5.5 (a raw-string
    comparison would call the app's own freshly installed model
    "foreign" and clear a healthy identity — the rule exists to
    prevent exactly that).
  no_stranded_downloads: >-
    ABSOLUTE (the qwen15b contract §4b no_stranded_downloads; plan §9
    S5): the sweep NEVER uninstalls the derived selected filename (the
    AppConfig.gemmaModelUrl override derives its own filename and stays
    legal — §1 env_override); the both-assets composition preserves
    the GGUF file + row; the reset leg never fires when the composite
    probe disagrees.

# ---------------------------------------------------------------------------
# 5. RAM budget (plan §2.5 — the honest figures; the ≤ 6 GB binding cap
#    carries from the E2B contract §6 through the qwen15b contract §5)
# ---------------------------------------------------------------------------

ram_budget:
  binding_cap: >-
    runtime RAM ≤ 6 GB (the standing user directive — the E2B contract
    §6 binding_cap, carried through the qwen15b contract §5; the
    governing machinery is UNCHANGED, plan §2.5). The §5 estimated peak
    holds the cap with wide margin.
  file_size: >-
    1.56 GB (§1) — SMALLER than the currently-shipped 1.60 GB .task
    (cycle-42 §1.2: 1,598,556,720 B) and far smaller than the 2.59 GB
    E2B era (plan §2.5).
  peak_rss_status: >-
    UNVERIFIED-ESTIMATE (plan §2.5, marked as such — BINDING HONESTY):
    NO vendor-measured Android figure exists for llama.cpp ×
    MiniCPM5-2B × Android phone. The estimate: weights ≈ 1.56 GB
    (mmap-touched) + KV: 42 layers × 2 (K+V) × 2 KV-heads × head-dim
    ≈ 128 × f16 ≈ 42 KB/token → ~86 MB at a 2,048-token context;
    compute/scratch buffers a few hundred MB. ESTIMATED PEAK ≈ 2.0–2.3 GB.
  comparison: >-
    Comparable to the VENDOR-MEASURED 2,216 MB of the current q8 1.5B
    .task on a Samsung S25 Ultra (cycle-42 §1.2 — the only measured
    figure in the lineage), on a slightly lighter file (plan §2.5).
  estimate_language_rule: >-
    (S6) The estimated-peak language is recorded as an ESTIMATE
    EVERYWHERE it appears — NEVER presented as measured (plan §9 S6).
    §9's S6 RAM stop fires only on a materially higher MEASURED figure
    at the smoke or device gates (load failure, OOM-kill on the
    owner's device), NOT on this estimate (plan §2.5/§9 S6).
  floor_and_override: >-
    The governing machinery is UNCHANGED (plan §2.5): the 4 GB totalMem
    floor + the cycle-43 low-RAM override ("Download anyway" + honest
    warning) stay (§3 under_floor_override_class); the owner's device
    (OPPO CPH2591, arm64, 3.64 GB RAM, cycle-44 §5-P1) uses the
    override as today. The override does NOT repeal the physics — it
    converts the floor from a refusal into informed consent (the
    qwen15b contract §5 selection_floor discipline carries).
  context_bound: >-
    maxTokens: 2048 (the WHOLE conversation budget on the llama path —
    §2 load_shape) is kept to bound the RAM estimate (plan §2.5; F7):
    the KV figure above is computed at a 2,048-token context. Raising
    the context is a FUTURE cycle with device evidence (plan §3 F7).
  backend_ruling: >-
    CPU on Android (§2 load_shape, plan §5.5) — the estimate above is a
    CPU-path estimate; GPU on phones is out of qualification scope
    (the superseded plan's same-day evidence, carried by plan §2.3).

# ---------------------------------------------------------------------------
# 6. Thinking contract (plan §2.4 the verified mechanics + §5.6 the
#    ruling — BINDING; the directive's ask 2. The #1 cycle risk lives
#    here and is decided EMPIRICALLY by the P2 step-0 smoke, plan §7)
# ---------------------------------------------------------------------------

# >>> SUPERSEDED-NEVER-SHIPPED at v1.1.0 (2026-11-02 — cycle-46 scope-exit
# amendment, header record above; plans/cycle-46-minicpm5-llama.md §6.2,
# BINDING): the owner withdrew the thinking ask — THIS SECTION and §7/§8
# are kept in place AS THE RECORD of the ruled-but-dropped contract
# (never deleted, never rewritten). WHAT SURVIVES, BINDING: chat
# creation passes enableThinking: false EXPLICITLY on EVERY send — never
# omitted, never defaulted (the template off-switch analysis below is
# the REASON; an unset kwarg lets the model decide); stray thinking
# content (ThinkingResponse tokens or think-span text) is DROPPED at the
# service seam — never rendered, never persisted, never re-sent (§10
# stop_divergences S7). NO toggle exists and NO §8 UI ships (plan §7
# criteria 6-7 as amended).

thinking_contract:
  the_switch: >-
    THE SWITCH IS THE TEMPLATE'S enable_thinking KWARG (plan §2.4) —
    the GGUF's embedded template (§1 embedded_template): true → the
    generation prefill opens a bare think block (the model opens its
    thought); false → the prefill is an EMPTY think block (thinking-off
    is the template's STRUCTURAL OFF-SWITCH); UNDEFINED → NO prefill —
    THE MODEL DECIDES (a deep-thinking-SFT model may think by default —
    §1 deep_thinker_note). The vendor card's own usage passes
    enable_thinking=True explicitly (plan §2.4).
  the_explicit_rule: >-
    THE APP MUST PASS enableThinking EXPLICITLY ON EVERY CHAT CREATION
    — NEVER RELY ON A DEFAULT (plan §2.4/§5.6; S7). The persisted
    toggle (§8, DEFAULT OFF) drives the value: OFF → enableThinking:
    false; ON → enableThinking: true. The S2 verify item (c) records
    the effective default in the resolved core 2.5.5 for the report,
    but the app NEVER depends on it: an unset kwarg lets the model
    decide (plan §2.4). Carried evidence for the rule (the superseded
    plan's same-day fetch, cited by plan §2.4's lineage): llamadart's
    own enableThinking default is documented TRUE on later 0.17.x —
    UNVERIFIED at the pinned 0.15.1, which is precisely why the
    explicit pass is structural, not advisory.
  default_off_grounding: >-
    The OFF default is TRIPLE-GROUNDED (plan §5.6): (1) the template's
    structural off-switch (§2.4 — an undefined kwarg lets the model
    decide); (2) the deep-thinking-SFT training (§2.6 — ON-by-default
    would surprise every casual send); (3) the honest cost (thinking
    counts toward maxOutputTokens, slows generation, drains battery).
  the_branch_ruling: >-
    THE CYCLE'S #1 RISK — PRE-RULED, DECIDED EMPIRICALLY BY THE P2
    STEP-0 SMOKE (plan §2.4/§5.6/§7): core parses think tags into
    ThinkingResponse ONLY for ModelType.deepSeek, qwen, qwen3, qwen35 —
    "general, phi and the others have none" (fluttergemma.dev
    /docs/thinking-mode, verbatim; ModelType.llama is one of "the
    others"). Without a parser, "its raw thinking blocks arrive inside
    the answer as ordinary TextResponse tokens. Strip them yourself, or
    don't advertise a thinking UI for those models." Whether llamadart's
    template layer surfaces ThinkingResponse on the llama engine for a
    ModelType.llama install is UNVERIFIED — the docs do not say (plan
    §2.4).
  branch_a: >-
    IF the smoke gate proves the llama path surfaces the reasoning as
    ThinkingResponse → the service seam consumes it DIRECTLY (plan
    §5.6).
  branch_b: >-
    OTHERWISE the service seam implements THE DOCS' PRESCRIBED REMEDY
    (plan §5.6): a think-span SEGMENTER on the token stream — open-tag
    → close-tag spans become the thinking channel; the remainder the
    answer; an UNCLOSED span at maxOutputTokens is treated as
    THINKING-ONLY, NEVER persisted as an answer — a bounded,
    fully-testable transform CONFINED to gemma_service.dart.
  branch_decision_gate: >-
    (plan §7 — BINDING, BEFORE ANY APP SURGERY) The step-0 smoke runs
    the connector's example app (packages/flutter_edge_ai_llama/example,
    Windows desktop runner) with the ACTUAL asset — fetch
    MiniCPM5-2B-Q4_K_M.gguf, verify the §1 sha256 after download,
    install per the connector example's flow (ModelType.llama +
    ModelFileType.gguf) — then THREE probes: (1) a plain question with
    enableThinking: false → expect a coherent answer, NO thinking
    content; (2) a hard question with enableThinking: true → RECORD
    WHAT ARRIVES: ThinkingResponse tokens (branch a) or raw think-tag
    text inside TextResponse (branch b) or NEITHER (a defect); (3) a
    probe with enableThinking UNSET → records the unpinned default
    behavior (evidence for the explicit-kwarg ruling). PASS = load +
    probes 1–2 behave per THIS contract on SOME branch. FAIL = STOP
    (S2) — report verbatim; the pre-stated re-rules are in §10
    stop_divergences. The smoke evidence (three probes + the recorded
    branch) attaches to the P2 phase report (plan §7 criterion 8).
  ui_identical_either_way: >-
    The UI contract (§8) is IDENTICAL EITHER WAY (plan §2.4/§5.6) —
    the branch changes the service seam's INPUT shape, never the
    presentation states.
  persistence_discipline: >-
    STRUCTURALLY ENFORCED (plan §5.6): thinking text is NEVER written
    to the chat transcript DB and NEVER re-sent in history — the send
    paths assemble history from STORED MESSAGES ONLY, so storing only
    the final answer satisfies it BY CONSTRUCTION; visible thinking
    lives in widget state for the session. Test-proven: the transcript
    DB receives ONLY the final answer (plan §7 criterion 6; §8 AC4 at
    the UI layer).
  output_budget_note: >-
    Thinking counts toward maxOutputTokens (2048 — §2 load_shape): a
    thinking ON send can run to the output cap on a hard question —
    the stop affordance is the user's escape hatch (plan §5.6/§5.10).
    The OFF state produces answers identical in shape to today's chat
    — NO thinking content surfaced (plan §7 criterion 6).

# ---------------------------------------------------------------------------
# 7. Thinking loop guard (plan §2.4 + §5.6 leg 4 + F6 — the vendor-
#    prescribed llama.cpp anchor; S7 is the phase-fail gate)
# ---------------------------------------------------------------------------

# >>> SUPERSEDED-NEVER-SHIPPED at v1.1.0 (2026-11-02 — cycle-46 scope-exit
# amendment; plans/cycle-46-minicpm5-llama.md §6.2, BINDING): the
# four-leg loop guard and the s7_gate below are RETIRED WITH THE
# WITHDRAWN FEATURE — kept in place AS THE RECORD, never deleted, never
# rewritten. STILL TRUE as GENERAL chat requirements (plan §9 S7 as
# amended — NOT S7 legs): maxOutputTokens 2048 caps every send (§2
# load_shape), stopGeneration() is wired to the stop affordance AND the
# watchdog (§10 watchdog_extension), streaming keeps the UI alive. The
# binding S7 is now the TWO invariants recorded at §10 stop_divergences
# S7.

thinking_loop_guard:
  four_legs: >-
    (plan §5.6) The loop guard has FOUR legs: (i) maxOutputTokens caps
    every send at 2048 (thinking counts toward it); (ii) streaming
    keeps the UI alive so a stuck thought is VISIBLE, not silent WAIT;
    (iii) stopGeneration() is wired to the stop affordance AND the
    app's stall watchdog (the watchdog extends to generation via
    stopGeneration() on timeout — plan §5.5); (iv) the vendor's sampler
    guidance WHERE THE API ALLOWS (the vendor_anchor below).
  vendor_anchor: >-
    THE VENDOR-PRESCRIBED ANCHOR (llama.cpp-specific — vendor card,
    plan §2.4, VERBATIM): "In llama.cpp, the default min_p=0.05 can
    lead to repetitive output: it filters out tokens whose probability
    is below 5% of the highest-probability token, potentially
    discarding the exact tokens needed to break out of a repetition
    loop. To prevent this, we set min_p=0.0." Recommended sampling
    (plan §2.4): temperature: 1.0, top_p: 0.95, min_p: 0.0.
  conditional_application: >-
    (F6 — plan §2.4/§3) CONDITIONAL on the pinned-source read (S2
    verify item (e)): IF the pinned llamadart 0.15.1 EXPOSES sampler
    params at chat creation, the app sets them per the vendor anchor;
    IF NOT, the guard stays legs (i)–(iii) and the gap is recorded
    honestly (plan §2.4). Leg (iv) is never silently dropped — either
    applied per the vendor or the gap recorded in the P2 report.
  thinking_token_budget_unavailable: >-
    The thinking budget (thinkingTokenBudget) is LITERTLM-ONLY —
    UNAVAILABLE on the llama engine (the superseded plan's same-day
    evidence, carried by plan §2.4). The llama path's guard is the
    four legs above; no budget parameter is assumed to exist.
  modeltype_defaults_note: >-
    ModelType.llama is documented with "its sampling defaults" (plan
    §2.3): whether those defaults interact with the vendor's
    prescription (or override it where the app does not set params) is
    part of the S2 (e) pinned-source read — recorded at P2, never
    assumed.
  s7_gate: >-
    (plan §9 S7 — BINDING) Thinking defaults OFF in code AND copy;
    enableThinking passed EXPLICITLY on every chat creation;
    maxOutputTokens caps every send; stopGeneration() reachable from
    the UI AND the watchdog; thinking text never persisted (§6). ANY
    PHASE SHIPPING THINKING WITHOUT ALL FIVE = PHASE FAIL.

